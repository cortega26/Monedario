<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Monedario brand isotype — "stacked coins / organized collection"
    Three horizontal rounded pills of increasing width, tapering upward.
    Concept: the physical monedario (coin case) seen in cross-section.
    Colors: light #1a4f8a (navy) / dark #4a9edd
  -->
  <style>
    .m { fill: #1a4f8a; }
    @media (prefers-color-scheme: dark) { .m { fill: #4a9edd; } }
  </style>
  <!-- Top pill — narrowest (coin at top of stack) -->
  <rect class="m" x="34" y="12"  width="60"  height="26" rx="13"/>
  <!-- Middle pill -->
  <rect class="m" x="19" y="51"  width="90"  height="26" rx="13"/>
  <!-- Bottom pill — widest (base of stack) -->
  <rect class="m" x="4"  y="90"  width="120" height="26" rx="13"/>
</svg>
