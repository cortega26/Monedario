name: Upload workflow artifact
description: >-
  Upload a workflow artifact with explicit retention and configurable
  missing-file behavior so workflows do not duplicate the pinned upload step.

inputs:
  artifact-name:
    description: Name of the artifact to upload.
    required: true
  path:
    description: File or directory path expression passed to the upload action.
    required: true
  retention-days:
    description: Number of days to retain the uploaded artifact.
    required: true
  if-no-files-found:
    description: Behavior when the configured path does not match any files.
    required: false
    default: error

runs:
  using: composite
  steps:
    - name: Upload workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        path: ${{ inputs.path }}
