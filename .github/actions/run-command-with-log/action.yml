name: Run command with log
description: >-
  Execute one shell command, capture combined output to a log file, and expose
  the command outcome without failing the workflow step directly.

inputs:
  command:
    description: Shell command to execute.
    required: true
  log-path:
    description: Destination path for combined stdout and stderr.
    required: true

outputs:
  outcome:
    description: success when the command exits 0, failure otherwise.
    value: ${{ steps.command.outputs.outcome }}
  exit-code:
    description: Numeric exit code returned by the command.
    value: ${{ steps.command.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Run command and capture log
      id: command
      shell: bash
      env:
        RUN_COMMAND: ${{ inputs.command }}
        LOG_PATH: ${{ inputs.log-path }}
      run: |
        set +e

        mkdir -p "$(dirname "$LOG_PATH")"
        bash -o pipefail -c "$RUN_COMMAND" > "$LOG_PATH" 2>&1
        exit_code=$?

        if [[ "$exit_code" -eq 0 ]]; then
          outcome=success
        else
          outcome=failure
        fi

        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        exit 0
