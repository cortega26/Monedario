name: Bootstrap pnpm workspace
description: >-
  Install the workspace's pnpm (from package.json packageManager), configure
  Node.js with pnpm cache, and install workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      shell: bash
      # Derive the pnpm version from the repo's `packageManager` field so CI can
      # never drift from the version that wrote pnpm-lock.yaml. A mismatch makes
      # `pnpm install --frozen-lockfile` fail in CI while it passes locally.
      run: |
        PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
        echo "Installing pnpm@${PNPM_VERSION} (from package.json packageManager)"
        npm install -g "pnpm@${PNPM_VERSION}"

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
