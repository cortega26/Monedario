name: Bootstrap pnpm workspace
description: >-
  Install the workspace's pnpm (from package.json packageManager), configure
  Node.js with pnpm cache, and install workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: true

runs:
  using: composite
  steps:
    # The disposable self-hosted image is intentionally minimal: unlike
    # GitHub-hosted Ubuntu, it has no preinstalled node/npm binaries.
    # Provision Node before reading package.json or invoking npm.
    - name: Provision Node.js for pnpm bootstrap
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install pnpm
      shell: bash
      # Derive the pnpm version from the repo's `packageManager` field so CI can
      # never drift from the version that wrote pnpm-lock.yaml. A mismatch makes
      # `pnpm install --frozen-lockfile` fail in CI while it passes locally.
      run: |
        PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
        PNPM_HOME="${RUNNER_TEMP}/pnpm"
        echo "Installing pnpm@${PNPM_VERSION} (from package.json packageManager)"
        npm install --global --prefix "${PNPM_HOME}" "pnpm@${PNPM_VERSION}"
        # Ephemeral JIT runners have a deliberately small /home/runner tmpfs.
        # Keep pnpm's SQLite store under the job's larger runner temp volume,
        # not in the 512 MiB home directory.
        "${PNPM_HOME}/bin/pnpm" config set store-dir "${RUNNER_TEMP}/pnpm-store"
        echo "${PNPM_HOME}/bin" >> "${GITHUB_PATH}"

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
