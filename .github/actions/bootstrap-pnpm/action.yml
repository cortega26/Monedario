name: Bootstrap pnpm workspace
description: >-
  Install pinned pnpm, configure Node.js with pnpm cache, and install workspace
  dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@10.30.2

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
