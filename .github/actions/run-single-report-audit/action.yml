name: Run single report audit
description: >-
  Bootstrap the pnpm workspace, run one report-producing audit command, and
  expose the audit outcome so workflows can keep artifact publishing and issue
  handling logic explicit.

inputs:
  command:
    description: Shell command to execute for the audit.
    required: true
  node-version:
    description: Node.js version used by the shared pnpm bootstrap action.
    required: false
    default: "22"

outputs:
  outcome:
    description: success when the audit command exits 0, failure otherwise.
    value: ${{ steps.audit.outputs.outcome }}
  exit-code:
    description: Numeric exit code returned by the audit command.
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Bootstrap pnpm workspace
      uses: ./.github/actions/bootstrap-pnpm
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run audit command
      id: audit
      shell: bash
      env:
        AUDIT_COMMAND: ${{ inputs.command }}
      run: |
        set +e

        bash -o pipefail -c "$AUDIT_COMMAND"
        exit_code=$?

        if [[ "$exit_code" -eq 0 ]]; then
          outcome=success
        else
          outcome=failure
        fi

        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        exit 0
