name: Bootstrap Python workspace
description: >-
  Install pinned uv, configure Python 3.14 with uv cache, and install
  project dependencies from uv.lock.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    # The disposable JIT runner mounts /home/runner as a 512 MiB tmpfs, while
    # the job's work volume (/runner) has 5 GiB. uv's default cache lives in
    # ~/.cache/uv, so a cache restore plus a few wheels exhausts /home and
    # `uv sync` dies with "No space left on device (os error 28)".
    - name: Point uv cache at the job workspace
      shell: bash
      run: echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"

    - name: Install uv
      shell: bash
      run: |
        UV_BIN_DIR="${RUNNER_TEMP}/uv-bin"
        mkdir -p "${UV_BIN_DIR}"
        curl -fsSL https://github.com/astral-sh/uv/releases/download/0.8.5/uv-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz -C "${UV_BIN_DIR}" --strip-components=1
        echo "${UV_BIN_DIR}" >> "${GITHUB_PATH}"

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache uv artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ${{ runner.temp }}/uv-cache
          .venv
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen
