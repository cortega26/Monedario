name: Bootstrap Python workspace
description: >-
  Install pinned uv, configure Python 3.14 with uv cache, and install
  project dependencies from uv.lock.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.14"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        curl -fsSL https://github.com/astral-sh/uv/releases/download/0.8.5/uv-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz -C /usr/local/bin --strip-components=1

    - name: Setup Python
      uses: actions/setup-python@423e9b5a7cf30e1f9dc1ad20fec38749854f34f8 # v6.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache uv artifacts
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          .venv
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen
