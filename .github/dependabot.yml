version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
    rebase-strategy: "auto"
