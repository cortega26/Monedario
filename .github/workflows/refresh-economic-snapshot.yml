name: Refresh Volatile Data Snapshots

# Primary scheduled refresh of the economic snapshot was migrated to a
# Cloudflare Worker on 2026-05-16 (see ADR-20260516-economic-snapshot-cloudflare-worker.md)
# to decouple from GitHub Actions billing/quota incidents. This workflow is
# retained as a manual fallback only — it still refreshes editorial-volatile-data
# (HTML scraping of spensiones.cl) which was not ported to the Worker in V1.
#
# To re-enable the daily schedule, restore the `schedule:` block below.
#
#  schedule:
#    - cron: "15 10 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

concurrency:
  group: refresh-volatile-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh volatile data snapshots and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🔄 Refresh economic snapshot"
        run: pnpm run economic:snapshot:refresh

      - name: "🧭 Refresh editorial volatile data snapshot"
        run: pnpm run editorial:volatile-data:refresh

      - name: "🗓️ Compute per-article review policies"
        run: pnpm run editorial:review-policies:compute

      - name: "📬 Create pull request"
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(editorial): refresh volatile data snapshots"
          title: "chore(editorial): refresh volatile data snapshots"
          body: |
            Automated refresh of volatile data snapshots used by runtime and editorial guards.

            - Trigger: scheduled workflow (`refresh-economic-snapshot.yml`) or manual dispatch.
            - Command: `pnpm run economic:snapshot:refresh`.
            - Command: `pnpm run editorial:volatile-data:refresh`.
            - Sources: `https://mindicador.cl/api`, `https://www.spensiones.cl`.
          branch: chore/refresh-volatile-data-snapshots
          delete-branch: true
          add-paths: |
            src/infrastructure/economic/economic-parameters.snapshot.json
            src/infrastructure/editorial/editorial-volatile-data.snapshot.json
            src/data/blog

      - name: "🔀 Attempt safe auto-merge"
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: ./.github/actions/enable-safe-automerge
        with:
          pull-request: ${{ steps.create-pr.outputs.pull-request-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
