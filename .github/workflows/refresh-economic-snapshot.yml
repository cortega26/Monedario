name: Refresh Volatile Data Snapshots

# The scheduled refresh of the economic snapshot runs on the Cloudflare Worker
# (see ADR-20260516-economic-snapshot-cloudflare-worker.md), confirmed deployed
# and committing daily as `monedario-snapshot-bot` (crons 15 10/14/18 UTC). The
# 2026-05-29 interim GHA schedule (ADR-20260529) was therefore removed to avoid a
# double refresh — the economic fetch in this workflow is manual-only and kept
# as a disaster-recovery fallback.
#
# It still refreshes editorial-volatile-data (spensiones.cl scraping) and
# review policies, which were never ported to the Worker. A lightweight weekly
# schedule keeps that editorial projection inside the 30-day review SLA without
# re-fetching or overwriting the Worker-managed economic snapshot.

on:
  schedule:
    - cron: "20 6 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-volatile-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh volatile data snapshots and open PR
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🔄 Refresh economic snapshot"
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run economic:snapshot:refresh

      - name: "🧭 Refresh editorial volatile data snapshot"
        run: pnpm run editorial:volatile-data:refresh

      - name: "🗓️ Compute per-article review policies"
        run: pnpm run editorial:review-policies:compute

      - name: "📬 Create pull request"
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(editorial): refresh volatile data snapshots"
          title: "chore(editorial): refresh volatile data snapshots"
          body: |
            Automated refresh of volatile data snapshots used by runtime and editorial guards.

            - Trigger: `${{ github.event_name }}` from `refresh-economic-snapshot.yml`.
            - Scheduled runs reuse the Worker-managed economic snapshot.
            - Manual runs also execute `pnpm run economic:snapshot:refresh` as a fallback.
            - Command: `pnpm run editorial:volatile-data:refresh`.
            - Sources: `https://mindicador.cl/api`, `https://www.spensiones.cl`.
          branch: chore/refresh-volatile-data-snapshots
          delete-branch: true
          add-paths: |
            src/infrastructure/economic/economic-parameters.snapshot.json
            src/infrastructure/editorial/editorial-volatile-data.snapshot.json
            src/data/blog

      # Refresh PRs stay open for manual review while `add-paths` includes
      # src/data/blog. Re-enable auto-merge only after the review-policy
      # generator is proven to leave human-review dates untouched.
