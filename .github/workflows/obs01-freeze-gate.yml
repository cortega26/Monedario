name: OBS-01 freeze gate

# Enforces §10 ("No hacer durante OBS-01") in
# docs/backlog/PLAN-calculator-led-growth-2026-06-28.md mechanically instead
# of relying on memory. While OBS-01's baseline is open, changes to the four
# cohort tools' own pages (seguro-cesantia, operacion-renta, prepago-credito,
# credito-consumo) or to the shared components that shape their journeys and
# measurement must wait until OBS-01's §14 Progress Log row reads DONE. It
# was documentation-only and got violated twice on 2026-07-12 — see that
# date's §14 entry — which is why this gate exists.
#
# Override: apply the 'obs01-freeze-override' label to a PR once a human has
# confirmed the change doesn't affect the OBS-01 cohort's journeys or
# measurement (the label must exist in the repo first — create it via
# `gh label create obs01-freeze-override` if missing).

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
    paths:
      - "src/pages/calculadoras/seguro-cesantia.astro"
      - "src/pages/calculadoras/operacion-renta.astro"
      - "src/pages/calculadoras/prepago-credito.astro"
      - "src/pages/calculadoras/credito-consumo.astro"
      - "src/scripts/calculator-prefill.ts"
      - "src/components/CalculatorResultNextActions.astro"
      - "src/components/NextBestStep.astro"
      - "src/scripts/next-best-step.ts"
      - "src/data/nextBestStep/rules.ts"
      - "src/scripts/analytics.ts"
      - "docs/backlog/PLAN-calculator-led-growth-2026-06-28.md"
      - "scripts/check-obs01-freeze.mjs"
      - ".github/workflows/obs01-freeze-gate.yml"
  workflow_dispatch:

concurrency:
  group: obs01-freeze-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze-check:
    name: OBS-01 freeze check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: "🧊 Check OBS-01 freeze (§10)"
        run: node scripts/check-obs01-freeze.mjs
        env:
          OBS01_FREEZE_BASE_REF: ${{ github.base_ref }}
          OBS01_FREEZE_OVERRIDE: ${{ (github.event.pull_request.labels && contains(github.event.pull_request.labels.*.name, 'obs01-freeze-override')) && '1' || '0' }}
