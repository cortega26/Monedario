name: Data Signals

on:
  schedule:
    # Runs daily at 06:00 UTC (03:00 Chile summer, 02:00 winter)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to fetch (e.g. 2026-W17). Leave blank for previous complete week."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print output without writing files or committing"
        type: boolean
        default: false

concurrency:
  group: data-signals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch GSC + Cloudflare signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Resolve Cloudflare configuration
        shell: bash
        env:
          WORKFLOW_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const workflowVars = JSON.parse(process.env.WORKFLOW_VARS_JSON || "{}");
          const envLines = [
            `CLOUDFLARE_ZONE_ID=${workflowVars.CLOUDFLARE_ZONE_ID ?? ""}`,
            `CLOUDFLARE_ACCOUNT_ID=${workflowVars.CLOUDFLARE_ACCOUNT_ID ?? ""}`,
          ];

          fs.appendFileSync(process.env.GITHUB_ENV, `${envLines.join("\n")}\n`);
          EOF

      - name: Validate provider configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for name in \
            GOOGLE_APPLICATION_CREDENTIALS_JSON \
            CLOUDFLARE_ANALYTICS_TOKEN \
            CLOUDFLARE_ZONE_ID \
            CLOUDFLARE_ACCOUNT_ID
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            echo "Expected secrets: GOOGLE_APPLICATION_CREDENTIALS_JSON, CLOUDFLARE_ANALYTICS_TOKEN" >&2
            echo "Expected repository/environment variables: CLOUDFLARE_ZONE_ID, CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Resolve week
        id: week
        env:
          INPUT_WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$INPUT_WEEK" ]; then
            echo "value=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # previous complete ISO week (ends last Sunday)
            DOW=$(date +%u)   # 1=Mon … 7=Sun (GNU date, ubuntu-latest)
            LAST_SUNDAY=$(date -d "today - ${DOW} days" +%Y-%m-%d)
            WEEK_MONDAY=$(date -d "${LAST_SUNDAY} - 6 days" +%Y-%m-%d)
            YEAR=$(date -d "${WEEK_MONDAY}" +%G)
            WEEK=$(date -d "${WEEK_MONDAY}" +%V)
            WEEK_STR="${YEAR}-W${WEEK}"
            echo "value=${WEEK_STR}" >> "$GITHUB_OUTPUT"
            echo "Resolved previous complete week: ${WEEK_STR}"
          fi

      - name: Fetch GSC signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-fetch.mjs --week="$WEEK"

      - name: Fetch GSC signals (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-fetch.mjs --week="$WEEK" --dry-run

      - name: Fetch Cloudflare signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/cloudflare-fetch.mjs --week="$WEEK"

      - name: Fetch Cloudflare signals (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/cloudflare-fetch.mjs --week="$WEEK" --dry-run

      - name: Commit data signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/operations/data-signals/
          if git diff --cached --quiet; then
            echo "No new signal files to commit."
          else
            git commit -m "data-signals: $WEEK [skip ci]"
            git push
          fi

      - name: LCP gate — alert if owner route p75 > 4000 ms
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/lcp-gate.mjs --week="$WEEK"
