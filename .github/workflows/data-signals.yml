name: Data Signals

on:
  schedule:
    # Runs Monday + Thursday at 06:00 UTC (03:00 Chile summer, 02:00 winter).
    # Reduced from daily to 2×/week to conserve GitHub Actions minutes.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to fetch (e.g. 2026-W17). Leave blank for previous complete week."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print output without writing files or committing"
        type: boolean
        default: false

concurrency:
  group: data-signals-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch GSC + Cloudflare signals
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve Cloudflare configuration
        shell: bash
        env:
          WORKFLOW_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const workflowVars = JSON.parse(process.env.WORKFLOW_VARS_JSON || "{}");
          const envLines = [
            `CLOUDFLARE_ZONE_ID=${workflowVars.CLOUDFLARE_ZONE_ID ?? ""}`,
            `CLOUDFLARE_ACCOUNT_ID=${workflowVars.CLOUDFLARE_ACCOUNT_ID ?? ""}`,
          ];

          fs.appendFileSync(process.env.GITHUB_ENV, `${envLines.join("\n")}\n`);
          EOF

      - name: Validate provider configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()

          for name in \
            GOOGLE_APPLICATION_CREDENTIALS_JSON \
            CLOUDFLARE_ANALYTICS_TOKEN \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ZONE_ID \
            CLOUDFLARE_ACCOUNT_ID
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            echo "Expected secrets: GOOGLE_APPLICATION_CREDENTIALS_JSON, CLOUDFLARE_ANALYTICS_TOKEN, CLOUDFLARE_API_TOKEN" >&2
            echo "Expected repository/environment variables: CLOUDFLARE_ZONE_ID, CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Resolve week
        id: week
        env:
          INPUT_WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$INPUT_WEEK" ]; then
            echo "value=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
          else
            # previous complete ISO week (ends last Sunday)
            DOW=$(date +%u)   # 1=Mon … 7=Sun (GNU date, ubuntu-latest)
            LAST_SUNDAY=$(date -d "today - ${DOW} days" +%Y-%m-%d)
            WEEK_MONDAY=$(date -d "${LAST_SUNDAY} - 6 days" +%Y-%m-%d)
            YEAR=$(date -d "${WEEK_MONDAY}" +%G)
            WEEK=$(date -d "${WEEK_MONDAY}" +%V)
            WEEK_STR="${YEAR}-W${WEEK}"
            echo "value=${WEEK_STR}" >> "$GITHUB_OUTPUT"
            echo "Resolved previous complete week: ${WEEK_STR}"
          fi

      - name: Fetch GSC signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-fetch.mjs --week="$WEEK"

      - name: Fetch GSC signals (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-fetch.mjs --week="$WEEK" --dry-run

      - name: Fetch GSC URL inspection (indexation coverage)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-inspect.mjs --week="$WEEK"

      - name: Fetch GSC URL inspection (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/gsc-inspect.mjs --week="$WEEK" --dry-run

      - name: Fetch Cloudflare signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/cloudflare-fetch.mjs --week="$WEEK"

      - name: Fetch Cloudflare signals (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/cloudflare-fetch.mjs --week="$WEEK" --dry-run

      - name: Fetch analytics export from R2
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/fetch-analytics-export.mjs --week="$WEEK"

      - name: Fetch analytics export from R2 (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/fetch-analytics-export.mjs --week="$WEEK" --dry-run

      - name: Validate analytics export — no secrets or raw events
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          set -euo pipefail
          FILE="output/operations/data-signals/analytics/${WEEK}.json"
          if [ ! -f "$FILE" ]; then
            echo "[validate-analytics] File not found: ${FILE} (export may not be available yet)"
            exit 0
          fi
          echo "[validate-analytics] Checking ${FILE}..."

          # Must be valid JSON
          if ! jq empty "$FILE" 2>/dev/null; then
            echo "[validate-analytics] FAIL: not valid JSON" >&2
            exit 1
          fi

          # schemaVersion must be 1
          SV=$(jq -r '.schemaVersion' "$FILE")
          if [ "$SV" != "1" ]; then
            echo "[validate-analytics] FAIL: schemaVersion=${SV}" >&2
            exit 1
          fi

          # Must NOT contain PII-like patterns (emails, RUTs, IPs)
          if grep -qiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' "$FILE"; then
            echo "[validate-analytics] FAIL: email-like pattern found" >&2
            exit 1
          fi
          if grep -qiE '\b[0-9]{1,2}\.[0-9]{3}\.[0-9]{3}-[0-9a-z]\b' "$FILE"; then
            echo "[validate-analytics] FAIL: RUT-like pattern found" >&2
            exit 1
          fi
          if grep -qiE '\b[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b' "$FILE"; then
            echo "[validate-analytics] FAIL: IP-like pattern found" >&2
            exit 1
          fi

          echo "[validate-analytics] OK — no PII/secrets detected"

      - name: Validate analytics export — no secrets or raw events (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "[validate-analytics] dry-run — validation skipped"

      - name: Commit data signals
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/operations/data-signals/
          if git diff --cached --quiet; then
            echo "No new signal files to commit."
          else
            git commit -m "data-signals: $WEEK [skip ci]"
            git push
          fi

      - name: LCP gate — alert if owner route p75 > 4000 ms
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          WEEK: ${{ steps.week.outputs.value }}
        run: |
          node scripts/data-signals/lcp-gate.mjs --week="$WEEK"
