name: Hero Images Manual Workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1"

jobs:
  refresh-hero-image-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Install pnpm"
        run: npm install -g pnpm@10.30.2

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🗂️ Scan publishable articles"
        run: node scripts/hero-images/scan-articles.mjs

      - name: "🧠 Build deterministic prompts"
        run: node scripts/hero-images/build-prompts.mjs

      - name: "📝 Manual-only reminder"
        run: |
          echo "[hero-images] Automatic API generation is disabled by policy."
          echo "[hero-images] Create/update hero images manually in public/images/hero and validate with check:hero-images."

      - name: "📤 Upload hero-image artifacts"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hero-images-artifacts
          retention-days: 14
          if-no-files-found: warn
          path: |
            scripts/hero-images/manifest.json
            scripts/hero-images/prompts.json
