name: Hero Images Generation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "dry-run or run"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - run
  schedule:
    - cron: "0 7 * * 1"

jobs:
  generate-hero-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Use Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🗂️ Scan publishable articles"
        run: node scripts/hero-images/scan-articles.mjs

      - name: "🧠 Build deterministic prompts"
        run: node scripts/hero-images/build-prompts.mjs

      - name: "🧪 Generate images (dry-run fallback)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DALL_E_MODEL: ${{ vars.DALL_E_MODEL }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'dry-run' }}
        run: |
          if [ "$RUN_MODE" = "run" ] && [ -n "$OPENAI_API_KEY" ]; then
            node scripts/hero-images/generate-images.mjs --run
            node scripts/hero-images/postprocess-images.mjs
          else
            node scripts/hero-images/generate-images.mjs --dry-run
            echo "[hero-images] Generation skipped (dry-run or missing OPENAI_API_KEY)."
          fi

      - name: "📤 Upload hero-image artifacts"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hero-images-artifacts
          retention-days: 14
          if-no-files-found: warn
          path: |
            scripts/hero-images/manifest.json
            scripts/hero-images/prompts.json
            scripts/hero-images/downloads
