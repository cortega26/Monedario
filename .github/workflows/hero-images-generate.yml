name: Hero Images Manual Workflow

permissions:
  contents: read

on:
  workflow_dispatch: {}
  # Schedule removed: scan-articles.mjs and build-prompts.mjs already run
  # in ci.yml's build job every Monday. The scheduled run here was fully
  # redundant with CI. Manual dispatch kept for on-demand use.

concurrency:
  group: hero-images-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-hero-image-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🗂️ Scan publishable articles"
        run: node scripts/hero-images/scan-articles.mjs

      - name: "🧠 Build deterministic prompts"
        run: node scripts/hero-images/build-prompts.mjs

      - name: "📝 Manual-only reminder"
        run: |
          echo "[hero-images] Automatic API generation is disabled by policy."
          echo "[hero-images] Create/update hero images manually in public/images/hero and validate with check:hero-images."

      - name: "📤 Upload hero-image artifacts"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: hero-images-artifacts
          retention-days: 14
          if-no-files-found: warn
          path: |
            scripts/hero-images/manifest.json
            scripts/hero-images/prompts.json
