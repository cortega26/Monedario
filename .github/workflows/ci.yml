name: CI

permissions:
  contents: read
  issues: write

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "README.*"
      - "LICENSE"
      - ".github/workflows/check-afp-commissions.yml"
      - ".github/workflows/check-ts7-readiness.yml"
      - ".github/workflows/claude-code-review.yml"
      - ".github/workflows/data-signals.yml"
      - ".github/workflows/dependency-automerge.yml"
      - ".github/workflows/doc-gardening.yml"
      - ".github/workflows/editorial-timeliness-audit.yml"
      - ".github/workflows/geo-files-review.yml"
      - ".github/workflows/guardrail-drift-audit.yml"
      - ".github/workflows/hero-images-generate.yml"
      - ".github/workflows/indexnow.yml"
      - ".github/workflows/lighthouse-ci.yml"
      - ".github/workflows/obs01-freeze-gate.yml"
      - ".github/workflows/page-lastmod.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-deps-autoupdate.yml"
      - ".github/workflows/refresh-economic-snapshot.yml"
      - ".github/workflows/security-scans.yml"
      - ".github/workflows/self-heal.yml"
      - ".github/workflows/weekly-search-ops.yml"
  workflow_dispatch:
  schedule:
    # Semanal (lunes 05:00 UTC). Antes diario; reducido para ahorrar minutos de
    # GitHub Actions — lint/test/build ya corre en cada PR. El run scheduled
    # conserva el chequeo de frescura del snapshot económico, la auditoría de
    # URLs y la apertura de issue ante fallo en main.
    - cron: "0 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code standards & tests
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🔍 Tooling versions"
        run: |
          node -v
          pnpm -v
          pnpm -s exec eslint -v
          pnpm -s list eslint @typescript-eslint/parser typescript

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧪 Run tests"
        run: pnpm run test:coverage

      - name: "🧱 Check domain boundaries"
        run: pnpm run check:boundaries

      - name: "📚 Check context layer"
        run: pnpm run check:context

      - name: "🧭 Check policy registry"
        run: pnpm run check:policy-registry

      - name: "🧮 Check mirrored legal constants"
        run: pnpm run check:legal-constants

      - name: "📖 Check docs structure"
        run: pnpm run check:docs

      - name: "🧾 Check audit artifacts schema"
        run: pnpm run check:audit-artifacts

      - name: "🔧 Check workers typecheck"
        run: pnpm run check:workers

  build:
    name: Code standards & build
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Runs on PRs (blocking gate) AND on the daily schedule against the default
    # branch, so drift that lands on main (e.g. a stale test guard) is caught
    # within ~24h instead of going undetected. See
    # docs/adr/ADR-20260529-repo-self-healing-maintenance.md.

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🔍 Tooling versions"
        run: |
          node -v
          pnpm -v
          pnpm -s exec eslint -v
          pnpm -s list eslint @typescript-eslint/parser typescript

      - name: "🧾 Check frontmatter contract"
        run: pnpm run check:frontmatter

      - name: "🗂️ Scan publishable articles for hero pipeline"
        run: node scripts/hero-images/scan-articles.mjs

      - name: "🧠 Build deterministic hero prompts"
        run: node scripts/hero-images/build-prompts.mjs

      - name: "🧭 Check semantic hero prompt contract"
        run: node scripts/check-hero-prompts.mjs

      - name: "🔄 Convert PNG hero images to AVIF"
        run: node scripts/png-to-avif.mjs --dir public/images/hero

      - name: "🖼️ Check hero image contract"
        run: node scripts/check-hero-images.mjs

      - name: "✍️ Check editorial invariants"
        run: pnpm run check:editorial
        env:
          EDITORIAL_ENFORCE: "1"
          EDITORIAL_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          EDITORIAL_DIFF_BASE_REF: ${{ github.base_ref }}

      - name: "🚫 Guard against post.id URL regressions"
        run: pnpm run check:no-postid-urls

      - name: "🧭 Check public routes baseline"
        run: pnpm run check:routes

      - name: "🔬 Astro check"
        run: pnpm run astro check

      - name: "📦 Cache Astro build"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .astro
            dist
          key: astro-build-${{ runner.os }}-${{ hashFiles('src/data/**', 'src/pages/**', 'astro.config.ts') }}
          restore-keys: |
            astro-build-${{ runner.os }}-

      - name: "🚀 Build the project"
        run: pnpm run build:ci

      - name: "🕰️ Economic snapshot freshness (scheduled only)"
        if: github.event_name == 'schedule'
        run: pnpm run check:economic-snapshot-freshness

      - name: "🔗 URL check (CI mode)"
        id: urlcheck_ci
        run: pnpm run check:urls:ci

      - name: "📡 Check RSS baseline (no removals)"
        run: pnpm run check:rss

      # Al final del job a propósito: si el gate editorial falla en scheduled
      # (contenido con ventana de revisión vencida) el resto del job ya corrió
      # (typecheck, build, URL/RSS). Así un fallo editorial no enmascara fallos
      # técnicos de main (2026-08-03: el typecheck de main estuvo roto un día
      # sin detectarse porque este gate abortaba el job antes del astro check).
      - name: "🕒 Check editorial timeliness SLA"
        # No bloquear PRs de Dependabot o cambios no-editoriales con SLA
        # de revisión editorial vencido. El scheduled semanal sigue siendo
        # bloqueante para detectar deriva.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm run check:editorial-timeliness

      - name: "💾 Save build output handoff cache"
        # Solo cuando existe consumidor downstream (a11y-audit /
        # external-url-check-pr) y tras los gates del job: un run fallido o
        # cancelado no publica dist/ para que ningún job lo restaure.
        # Key exclusiva del intento: un rerun jamás puede restaurar el dist/
        # de un intento anterior (miss intencional en los consumidores).
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/
          key: site-build-handoff-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "🧩 Ensure URL check artifacts exist"
        if: always() && steps.urlcheck_ci.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: internal

      - name: "📤 Upload URL check artifacts"
        if: always()
        # Diagnostic artifact: a transient storage-quota hit must not fail the build check.
        continue-on-error: true
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-ci
          retention-days: 14
          scope: internal

      # On scheduled runs the gate gives no PR to surface a red result, so a
      # failure is escalated to a single tracking issue (and closed when green).
      - name: "🚨 Open issue on scheduled main failure"
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "CI: scheduled gate failing on main"
          body: |
            The daily scheduled CI gate failed against the default branch.

            This means drift has landed on `main` that the PR gate would have
            blocked (e.g. a failing test, format drift, or a broken contract
            check). Open the failed run, reproduce locally with `pnpm run
            check:ci` and `pnpm run test` (or `pnpm run build` for post-build
            gates), and fix in a small PR.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          desired-state: open
          labels-json: '["ci", "automation", "maintenance"]'

      - name: "✅ Close scheduled-failure issue when green"
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "CI: scheduled gate failing on main"
          desired-state: closed
          labels-json: '["ci", "automation", "maintenance"]'

  external-url-audit:
    name: External URL audit (non-blocking)
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🌐 Run external URL audit (non-blocking)"
        id: urlcheck_external_audit
        run: pnpm run check:urls:external:audit

      - name: "🧩 Ensure external URL audit artifacts exist"
        if: always() && steps.urlcheck_external_audit.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: external

      - name: "📤 Upload external audit artifacts"
        if: always()
        # Diagnostic artifact: a transient storage-quota hit must not fail the check.
        continue-on-error: true
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-external-audit
          retention-days: 30
          scope: external

  external-url-check-pr:
    name: External URL check – PR
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [lint-and-test, build]
    timeout-minutes: 15
    # Official/trusted hard failures block merge. Transient network errors and
    # explicitly non-blocking host categories remain telemetry-only.
    if: github.event_name == 'pull_request'

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "⬇️ Restore build output handoff cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/
          key: site-build-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: "🔗 External URL check (blocking gate – CI mode)"
        id: urlcheck_external_ci
        run: pnpm run check:urls:external:ci

      - name: "🧩 Ensure external URL CI artifacts exist"
        if: always() && steps.urlcheck_external_ci.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: external

      - name: "📤 Upload external URL CI artifacts"
        if: always()
        # Diagnostic artifact: a transient storage-quota hit must not fail the check.
        continue-on-error: true
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-external-ci
          retention-days: 14
          scope: external

  a11y-audit:
    name: Accessibility audit (non-blocking)
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🌐 Install Playwright browsers"
        run: pnpm exec playwright install chromium

      - name: "⬇️ Restore build output handoff cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/
          key: site-build-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: "🎯 Run accessibility tests"
        run: pnpm exec playwright test tests/accessibility/

      - name: "🔒 Run privacy tests"
        run: pnpm run test:privacy

      - name: "🛡️ Run resilience tests"
        run: pnpm run test:resilience

      - name: "📤 Upload accessibility report"
        if: always()
        # Diagnostic only; a storage-quota failure must not make this
        # explicitly non-blocking audit appear as a failed check.
        continue-on-error: true
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: a11y-report
          retention-days: 14
          if-no-files-found: warn
          path: |
            playwright-report/
