name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🔍 Tooling versions"
        run: |
          node -v
          pnpm -v
          pnpm -s exec eslint -v
          pnpm -s list eslint @typescript-eslint/parser typescript

      - name: "📚 Check context layer"
        run: pnpm run check:context

      - name: "🧭 Check policy registry"
        run: pnpm run check:policy-registry

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "🧱 Check domain boundaries"
        run: pnpm run check:boundaries

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧪 Run tests"
        run: pnpm run test:coverage

      - name: "🧾 Check frontmatter contract"
        run: pnpm run check:frontmatter

      - name: "🗂️ Scan publishable articles for hero pipeline"
        run: node scripts/hero-images/scan-articles.mjs

      - name: "🧠 Build deterministic hero prompts"
        run: node scripts/hero-images/build-prompts.mjs

      - name: "🧭 Check semantic hero prompt contract"
        run: node scripts/check-hero-prompts.mjs

      - name: "🔄 Convert PNG hero images to AVIF"
        run: node scripts/png-to-avif.mjs --dir public/images/hero

      - name: "🖼️ Check hero image contract"
        run: node scripts/check-hero-images.mjs

      - name: "✍️ Check editorial invariants"
        run: pnpm run check:editorial
        env:
          EDITORIAL_ENFORCE: "1"
          EDITORIAL_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          EDITORIAL_DIFF_BASE_REF: ${{ github.base_ref }}

      - name: "🕒 Check editorial timeliness SLA"
        run: pnpm run check:editorial-timeliness

      - name: "🚫 Guard against post.id URL regressions"
        run: pnpm run check:no-postid-urls

      - name: "🧭 Check public routes baseline"
        run: pnpm run check:routes

      - name: "🔬 Astro check"
        run: pnpm run astro check

      - name: "🚀 Build the project"
        run: pnpm run build:ci

      - name: "🔗 URL check (CI mode)"
        id: urlcheck_ci
        run: pnpm run check:urls:ci

      - name: "📡 Check RSS baseline (no removals)"
        run: pnpm run check:rss

      - name: "🧩 Ensure URL check artifacts exist"
        if: always() && steps.urlcheck_ci.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: internal

      - name: "📤 Upload URL check artifacts"
        if: always()
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-ci
          retention-days: 14
          scope: internal

      - name: "📤 Upload built site artifact"
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: site-dist
          retention-days: 3
          path: dist/

  external-url-audit:
    name: External URL audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🌐 Run external URL audit (non-blocking)"
        id: urlcheck_external_audit
        run: pnpm run check:urls:external:audit

      - name: "🧩 Ensure external URL audit artifacts exist"
        if: always() && steps.urlcheck_external_audit.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: external

      - name: "📤 Upload external audit artifacts"
        if: always()
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-external-audit
          retention-days: 30
          scope: external

  external-url-check-pr:
    name: External URL check – PR (non-blocking rollout)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    # Runs on every PR. continue-on-error:true keeps the workflow green during
    # initial rollout. Remove continue-on-error once the corpus is clean and
    # the engine has been validated against the full site.
    if: github.event_name == 'pull_request'
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "📥 Download built site artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist/

      - name: "🔗 External URL check (blocking gate – CI mode)"
        id: urlcheck_external_ci
        run: pnpm run check:urls:external:ci

      - name: "🧩 Ensure external URL CI artifacts exist"
        if: always() && steps.urlcheck_external_ci.outcome == 'skipped'
        uses: ./.github/actions/ensure-urlcheck-artifacts
        with:
          scope: external

      - name: "📤 Upload external URL CI artifacts"
        if: always()
        uses: ./.github/actions/upload-urlcheck-artifacts
        with:
          artifact-name: urlcheck-artifacts-external-ci
          retention-days: 14
          scope: external

  a11y-audit:
    name: Accessibility audit (non-blocking)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🌐 Install Playwright browsers"
        run: pnpm exec playwright install chromium

      - name: "📥 Download built site artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist/

      - name: "🎯 Run accessibility tests"
        run: pnpm exec playwright test tests/accessibility/

      - name: "📤 Upload accessibility report"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: a11y-report
          retention-days: 14
          if-no-files-found: warn
          path: |
            playwright-report/
