name: Deploy health

# El 2026-11-02 venció una excepción del URL-freeze y los builds de producción
# de Cloudflare Pages fallaron durante 8 días: el repositorio tenía datos
# frescos (el Worker de snapshot seguía haciendo commits) pero el sitio en vivo
# mostraba UF y dólar de hace una semana, y nadie se enteró.
#
# Los chequeos (sitio publicado, heartbeat del snapshot y excepciones del
# URL-freeze) corren en el Worker `monedario-deploy-health` cada 6 h y se
# exponen en `/status`. Este workflow ya NO instala el workspace: solo consulta
# ese endpoint (curl) y sincroniza un único issue con el `GITHUB_TOKEN` del
# repositorio. Sin PAT adicional.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Published site and freeze exceptions (via Worker)
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      STATUS_URL: ${{ vars.DEPLOY_HEALTH_STATUS_URL || 'https://monedario-deploy-health.carlosortega77.workers.dev/status' }}

    steps:
      # The local issue action lives in the repo; a sparse checkout keeps this
      # job to a few seconds instead of the old pnpm bootstrap.
      - name: "☁️ Checkout the local issue action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/upsert-issue-by-title
          sparse-checkout-cone-mode: false

      - name: "🩺 Fetch worker status"
        id: health
        continue-on-error: true
        run: |
          set +e
          code="$(curl -sS --max-time 60 -o status.json \
            -w '%{http_code}' "${STATUS_URL}?ts=$(date +%s)")"
          if [ "$code" != "200" ]; then
            printf '{"ok":false,"checkedAt":"%s","problems":["El Worker de deploy-health respondió HTTP %s."]}\n' \
              "$(date -u +%FT%TZ)" "$code" > status.json
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("status.json", encoding="utf-8") as handle:
              status = json.load(handle)
          sys.exit(0 if status.get("ok") else 1)
          PY

      - name: "📝 Build issue payload"
        id: payload
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            core.setOutput("title", "🚨 Despliegue del sitio desactualizado o excepción de freeze por vencer");
            core.setOutput("labels_json", JSON.stringify(["automation", "ci"]));

            let status = null;
            try {
              status = JSON.parse(fs.readFileSync("status.json", "utf8"));
            } catch (_) {}

            const healthy =
              "${{ steps.health.outcome }}" !== "failure" && status?.ok === true;
            if (healthy) {
              core.setOutput("desired_state", "closed");
              core.setOutput(
                "body",
                "Sitio publicado al día, snapshot fresco y sin excepciones por vencer; issue cerrado automáticamente."
              );
              return;
            }

            const problems = Array.isArray(status?.problems) && status.problems.length > 0
              ? status.problems
              : ["(sin detalle: el Worker no devolvió un estado legible)"];
            const findings = problems.map(problem => `- ${problem}`).join("\n");
            core.setOutput("desired_state", "open");
            core.setOutput(
              "body",
              [
                "## El sitio publicado o la gobernanza del URL-freeze necesitan atención",
                "",
                findings,
                "",
                `**Worker checked at:** ${status?.checkedAt ?? "?"}`,
                "",
                "### Qué hacer",
                "",
                "1. Si el sitio está desactualizado: abrir el último deploy de producción de Cloudflare Pages (proyecto `monedario`) y leer el log del build; `pnpm run build` localmente reproduce el fallo.",
                "2. Si el snapshot no se refresca: revisar el Worker `monedario-economic-snapshot-refresh` y el issue de drift de deploy.",
                "3. Si hay una excepción vencida o por vencer: renovarla (decisión del owner) o promover la URL a `docs/reports/indexable-url-inventory.json` y `docs/reports/routes_snapshot_before.json`, retirando la excepción.",
                "",
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n")
            );

      - name: "📝 Sync issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.payload.outputs.title }}
          body: ${{ steps.payload.outputs.body }}
          labels-json: ${{ steps.payload.outputs.labels_json }}
          desired-state: ${{ steps.payload.outputs.desired_state }}

      - name: "✅ Fail the run when the health check found problems"
        if: steps.health.outcome == 'failure'
        run: exit 1
