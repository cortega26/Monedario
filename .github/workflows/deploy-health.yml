name: Deploy health

# El 2026-11-02 venció una excepción del URL-freeze y los builds de producción
# de Cloudflare Pages fallaron durante 8 días: el repositorio tenía datos
# frescos (el Worker de snapshot seguía haciendo commits) pero el sitio en vivo
# mostraba UF y dólar de hace una semana, y nadie se enteró.
#
# El Worker `monedario-deploy-health` comprueba el sitio publicado y el
# heartbeat del snapshot (artefacto público `/api/deploy-health.json`). Este
# workflow lo consulta (curl), añade las excepciones del URL-freeze —datos
# privados— con el `GITHUB_TOKEN` del repositorio y sincroniza un único issue.
# No instala el workspace: de ~5 min a ~20 s. Sin PAT adicional.

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Published site, snapshot heartbeat and freeze exceptions
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      STATUS_URL: ${{ vars.DEPLOY_HEALTH_STATUS_URL || 'https://monedario-deploy-health.carlosortega77.workers.dev/status' }}

    steps:
      # The local issue action lives in the repo; a sparse checkout keeps this
      # job to a few seconds instead of the old pnpm bootstrap.
      - name: "☁️ Checkout the local issue action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/upsert-issue-by-title
          sparse-checkout-cone-mode: false

      - name: "🩺 Fetch worker status"
        id: worker
        continue-on-error: true
        run: |
          set +e
          code="$(curl -sS --max-time 60 -o worker-status.json \
            -w '%{http_code}' "${STATUS_URL}?ts=$(date +%s)")"
          if [ "$code" != "200" ]; then
            printf '{"ok":false,"checkedAt":"%s","problems":["El Worker de deploy-health respondió HTTP %s."]}\n' \
              "$(date -u +%FT%TZ)" "$code" > worker-status.json
            exit 1
          fi

      - name: "🩺 Merge URL-freeze exceptions"
        id: health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 - <<'PY'
          import base64
          import datetime
          import json
          import os
          import urllib.request

          problems = []
          worker_checked = None
          try:
              with open("worker-status.json", encoding="utf-8") as handle:
                  worker = json.load(handle)
              problems.extend(worker.get("problems") or [])
              worker_checked = worker.get("checkedAt")
          except Exception:
              problems.append("El Worker de deploy-health no devolvió un estado legible.")

          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "cortega26/Monedario")
          url = f"https://api.github.com/repos/{repo}/contents/docs/governance/url-freeze-exceptions.json"
          try:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "monedario-deploy-health",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              document = json.loads(base64.b64decode(payload["content"]))
              now = datetime.datetime.now(datetime.timezone.utc)
              for entry in document.get("exceptions", []):
                  if entry.get("decision") != "APPROVED":
                      continue
                  raw = entry.get("expiresAt")
                  if not raw:
                      continue
                  try:
                      expiry = datetime.datetime.fromisoformat(
                          str(raw).replace("Z", "+00:00")
                      )
                  except ValueError:
                      continue
                  if expiry.tzinfo is None:
                      expiry = expiry.replace(tzinfo=datetime.timezone.utc)
                  days = int((expiry - now).total_seconds() // 86400)
                  if days > 14:
                      continue
                  target = entry.get("url", "?")
                  if days < 0:
                      problems.append(
                          f"La excepción de URL-freeze de {target} venció el {raw}: "
                          "bloquea el CI y puede bloquear el deploy. Renuévala o "
                          "promueve la URL al inventario aprobado."
                      )
                  else:
                      problems.append(
                          f"La excepción de URL-freeze de {target} vence en {days} "
                          f"día(s) ({raw}). Renuévala o promueve la URL al inventario "
                          "aprobado antes de esa fecha."
                      )
          except Exception as error:
              problems.append(f"No se pudo consultar el registro de excepciones: {error}")

          status = {
              "ok": not problems,
              "checkedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workerCheckedAt": worker_checked,
              "problems": problems,
          }
          with open("status.json", "w", encoding="utf-8") as handle:
              json.dump(status, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          raise SystemExit(0 if status["ok"] else 1)
          PY

      - name: "📝 Build issue payload"
        id: payload
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            core.setOutput("title", "🚨 Despliegue del sitio desactualizado o excepción de freeze por vencer");
            core.setOutput("labels_json", JSON.stringify(["automation", "ci"]));

            let status = null;
            try {
              status = JSON.parse(fs.readFileSync("status.json", "utf8"));
            } catch (_) {}

            const healthy =
              "${{ steps.health.outcome }}" !== "failure" && status?.ok === true;
            if (healthy) {
              core.setOutput("desired_state", "closed");
              core.setOutput(
                "body",
                "Sitio publicado al día, snapshot fresco y sin excepciones por vencer; issue cerrado automáticamente."
              );
              return;
            }

            const problems = Array.isArray(status?.problems) && status.problems.length > 0
              ? status.problems
              : ["(sin detalle: el chequeo no produjo un estado legible)"];
            const findings = problems.map(problem => `- ${problem}`).join("\n");
            core.setOutput("desired_state", "open");
            core.setOutput(
              "body",
              [
                "## El sitio publicado o la gobernanza del URL-freeze necesitan atención",
                "",
                findings,
                "",
                `**Worker checked at:** ${status?.workerCheckedAt ?? status?.checkedAt ?? "?"}`,
                "",
                "### Qué hacer",
                "",
                "1. Si el sitio está desactualizado: abrir el último deploy de producción de Cloudflare Pages (proyecto `monedario`) y leer el log del build; `pnpm run build` localmente reproduce el fallo.",
                "2. Si el snapshot no se refresca: revisar el Worker `monedario-economic-snapshot-refresh` y el issue de drift de deploy.",
                "3. Si hay una excepción vencida o por vencer: renovarla (decisión del owner) o promover la URL a `docs/reports/indexable-url-inventory.json` y `docs/reports/routes_snapshot_before.json`, retirando la excepción.",
                "",
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n")
            );

      - name: "📝 Sync issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.payload.outputs.title }}
          body: ${{ steps.payload.outputs.body }}
          labels-json: ${{ steps.payload.outputs.labels_json }}
          desired-state: ${{ steps.payload.outputs.desired_state }}

      - name: "✅ Fail the run when the health check found problems"
        if: steps.health.outcome == 'failure'
        run: exit 1
