name: Editorial Timeliness Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: editorial-timeliness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit editorial timeliness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "🕒 Run editorial timeliness audit"
        id: audit
        uses: ./.github/actions/run-single-report-audit
        with:
          node-version: 22
          command: pnpm run check:editorial-timeliness

      - name: "📤 Upload editorial timeliness report"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: editorial-timeliness-report
          retention-days: 14
          path: output/validation/editorial-timeliness/report.json

      - name: "📝 Build editorial timeliness issue payload"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: issue_payload
        with:
          script: |
            const fs = require("fs");
            const title = "Editorial timeliness audit: stale review window";

            if ("${{ steps.audit.outputs.outcome }}" !== "failure") {
              core.setOutput("title", title);
              core.setOutput("desired_state", "closed");
              return;
            }

            let report = {
              today: "unknown",
              totalPublished: 0,
              staleCount: 0,
              staleSlugs: [],
              economicSnapshotLastUpdated: null,
            };

            try {
              report = JSON.parse(
                fs.readFileSync("output/validation/editorial-timeliness/report.json", "utf8")
              );
            } catch (_) {
              // Report file may be missing if the script failed before writing it.
            }

            const body = [
              "Automated editorial timeliness audit detected stale review windows.",
              "",
              `- Today: ${report.today}`,
              `- Published reviewed articles: ${report.totalPublished}`,
              `- Stale entries: ${report.staleCount}`,
              `- Economic snapshot last updated: ${report.economicSnapshotLastUpdated ?? "n/a"}`,
              "",
              "Stale slugs:",
              ...report.staleSlugs.map(slug => `- \`${slug}\``),
              "",
              "Artifact: `editorial-timeliness-report` from workflow run."
            ].join("\n");
            core.setOutput("title", title);
            core.setOutput("body", body);
            core.setOutput("desired_state", "open");

      - name: "📝 Sync editorial timeliness issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}

      - name: "✅ Fail workflow on stale entries"
        if: steps.audit.outputs.outcome == 'failure'
        run: exit 1
