name: Guardrail Drift Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 2"

concurrency:
  group: guardrail-drift-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit policy registry drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🧭 Run policy registry audit"
        id: policy_registry
        continue-on-error: true
        run: pnpm run check:policy-registry

      - name: "📤 Upload policy registry report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-registry-report
          retention-days: 14
          if-no-files-found: error
          path: output/validation/policy-registry/report.json

      - name: "📝 Create or update drift issue"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const title = "Guardrail drift audit: policy registry mismatch";
            const reportPath = "output/validation/policy-registry/report.json";
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find(issue => issue.title === title);

            if (report.status === "ok") {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
                core.info(`Closed issue #${existing.number}`);
              } else {
                core.info("No open guardrail drift issue to close.");
              }
              return;
            }

            const body = [
              "Automated guardrail audit detected drift between the policy registry and repo wiring.",
              "",
              `- Generated at: ${report.generatedAt}`,
              `- Errors: ${report.summary.errorCount}`,
              `- Warnings: ${report.summary.warningCount}`,
              "",
              "### Findings",
              ...report.findings
                .filter(item => item.level === "error")
                .map(item => `- \`${item.policyId}\`: ${item.message}${item.remediation ? ` — ${item.remediation}` : ""}`),
              "",
              "Artifact: `policy-registry-report` from the current workflow run.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                labels: ["governance", "automation"],
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["governance", "automation"],
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: "✅ Fail workflow on drift"
        if: steps.policy_registry.outcome == 'failure'
        run: exit 1
