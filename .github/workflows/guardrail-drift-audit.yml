name: Guardrail Drift Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 2"

concurrency:
  group: guardrail-drift-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit policy registry drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "🧭 Run policy registry audit"
        id: audit
        uses: ./.github/actions/run-single-report-audit
        with:
          node-version: 22
          command: pnpm run check:policy-registry

      - name: "📤 Upload policy registry report"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: policy-registry-report
          retention-days: 14
          path: output/validation/policy-registry/report.json

      - name: "📝 Build drift issue payload"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: issue_payload
        with:
          script: |
            const fs = require("fs");
            const title = "Guardrail drift audit: policy registry mismatch";
            const reportPath = "output/validation/policy-registry/report.json";
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

            if (report.status === "ok") {
              core.setOutput("title", title);
              core.setOutput("desired_state", "closed");
              core.setOutput("labels_json", JSON.stringify(["governance", "automation"]));
              return;
            }

            const body = [
              "Automated guardrail audit detected drift between the policy registry and repo wiring.",
              "",
              `- Generated at: ${report.generatedAt}`,
              `- Errors: ${report.summary.errorCount}`,
              `- Warnings: ${report.summary.warningCount}`,
              "",
              "### Findings",
              ...report.findings
                .filter(item => item.level === "error")
                .map(item => `- \`${item.policyId}\`: ${item.message}${item.remediation ? ` — ${item.remediation}` : ""}`),
              "",
              "Artifact: `policy-registry-report` from the current workflow run.",
            ].join("\n");

            core.setOutput("title", title);
            core.setOutput("body", body);
            core.setOutput("desired_state", "open");
            core.setOutput("labels_json", JSON.stringify(["governance", "automation"]));

      - name: "📝 Sync drift issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}
          labels-json: ${{ steps.issue_payload.outputs.labels_json }}

      - name: "✅ Fail workflow on drift"
        if: steps.audit.outputs.outcome == 'failure'
        run: exit 1
