name: TS7 Readiness Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1" # Every Monday at 09:30 UTC

concurrency:
  group: ts7-readiness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check TypeScript 7 readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "🔎 Check TS7 readiness"
        id: check
        run: node scripts/check-ts7-readiness.mjs

      - name: "📝 Build readiness issue payload when TS7 ships"
        if: steps.check.outputs.ts7_released == 'true'
        id: issue_payload
        shell: bash
        env:
          TS_VERSION: ${{ steps.check.outputs.ts_latest }}
          ASTRO_CHECK_VERSION: ${{ steps.check.outputs.astro_check_latest }}
          ASTRO_PEER_TS: ${{ steps.check.outputs.astro_peer_ts }}
        run: |
          set -euo pipefail

          {
            echo 'title<<__ISSUE_TITLE__'
            echo 'TS7 shipped — execute compatibility audit'
            echo '__ISSUE_TITLE__'
            echo 'body<<__ISSUE_BODY__'
            printf '%s\n' \
              "## TypeScript 7 stable has shipped 🎉" \
              "" \
              "- \`typescript@$TS_VERSION\` is now the stable release." \
              "- \`@astrojs/check@$ASTRO_CHECK_VERSION\` peerDep typescript: \`$ASTRO_PEER_TS\`" \
              "" \
              "## Next steps" \
              "" \
              "Execute the audit plan in \`docs/backlog/TS7_COMPATIBILITY_AUDIT_2026-04-30.md\`:" \
              "" \
              "1. Verify \`@astrojs/check\` Volar layer supports TS7 (check peer dep range and release notes)." \
              "2. Execute Phases 1–6 of the audit plan." \
              "3. Produce \`docs/reports/ts7-compatibility-audit.md\`." \
              "4. Disable this workflow (\`.github/workflows/check-ts7-readiness.yml\`) once the audit is complete."
            echo '__ISSUE_BODY__'
            echo 'desired_state=open'
          } >> "$GITHUB_OUTPUT"

      - name: "📝 Sync readiness issue"
        if: steps.check.outputs.ts7_released == 'true'
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}
