name: Docs CI

# ci.yml skips docs-only PRs via paths-ignore (docs/**, **.md, README.*), which
# leaves branch protection without a docs check on those PRs. This lightweight
# workflow runs on every PR so `Docs standards` always reports; it validates the
# docs structure, article frontmatter, the corrections registry and formatting.
# It intentionally does NOT run the editorial-timeliness gate: that gate fails
# on stale articles and is enforced on main/schedule, not per PR.

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs standards
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "📖 Check docs structure"
        run: pnpm run check:docs

      - name: "🧾 Check frontmatter"
        run: pnpm run check:frontmatter

      - name: "🧮 Check corrections registry"
        run: pnpm run check:correcciones

      - name: "📝 Check format"
        run: pnpm run format:check
