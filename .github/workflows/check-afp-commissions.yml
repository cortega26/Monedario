name: Check AFP Commission Rates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # First day of each month at 09:15 UTC (06:15 Chile time)
    - cron: "15 9 1 * *"

concurrency:
  group: afp-commissions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-afp-commissions:
    name: Validate AFP commission rates against Previred
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "🔍 Run AFP commission rate check"
        id: audit
        uses: ./.github/actions/run-single-report-audit
        with:
          node-version: 22
          command: node scripts/check-afp-commissions.mjs

      - name: "📤 Upload AFP commission check report"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: afp-commissions-report
          retention-days: 90
          if-no-files-found: warn
          path: output/validation/afp-commissions/report.json

      - name: "📝 Build AFP drift issue payload"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: issue_payload
        with:
          script: |
            const fs = require("fs");
            const reportPath = "output/validation/afp-commissions/report.json";
            const title = "⚠️ AFP commission rates require manual verification";

            if ("${{ steps.audit.outputs.outcome }}" !== "failure") {
              core.setOutput("title", title);
              core.setOutput("desired_state", "closed");
              core.setOutput("labels_json", JSON.stringify(["data-freshness", "financial-data"]));
              return;
            }

            let report = { date: "unknown", mismatches: [], status: "unknown" };
            try {
              report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            } catch (_) {
              // Report file may be missing if the script failed before writing it
            }

            const mismatchLines = (report.mismatches ?? []).map(
              m =>
                `| ${m.afp} | ${m.previredTotal?.toFixed(2) ?? "?"} | ${m.configTotal?.toFixed(2) ?? "?"} | ${m.diff > 0 ? "+" : ""}${m.diff?.toFixed(2) ?? "?"} |`
            );
            const body = [
              "## AFP Commission Rate Drift Detected",
              "",
              `**Date:** ${report.date}`,
              `**Status:** \`${report.status}\``,
              "",
              report.status === "fetch_error"
                ? `> Could not reach Previred to validate rates: \`${report.error}\``
                : "",
              "",
              mismatchLines.length > 0
                ? [
                    "### Mismatches",
                    "",
                    "| AFP | Previred (%) | Config (%) | Drift |",
                    "|-----|-------------|------------|-------|",
                    ...mismatchLines,
                  ].join("\n")
                : "",
              "",
              "### Action required",
              "",
              "1. Open [`src/config/afpCommissions.ts`](../blob/main/src/config/afpCommissions.ts) and verify each rate.",
              "2. Cross-check against [Previred Indicadores Previsionales](https://www.previred.com/indicadores-previsionales/).",
              "3. Confirm with at least one AFP official page:",
              "   - [AFP Capital](https://www.afpcapital.cl/comisiones)",
              "   - [AFP Uno](https://www.uno.cl/sobre-uno/nuestras-comisiones)",
              "4. Search `src/pages/calculadoras/` for any hardcoded AFP rate text that also needs updating.",
              "5. Close this issue once all rates are verified and the config is up to date.",
              "",
              "### Policy reference",
              "",
              "See [`docs/governance/FINANCIAL_DATA_VERIFICATION_POLICY.md`](../blob/main/docs/governance/FINANCIAL_DATA_VERIFICATION_POLICY.md) for the full verification procedure.",
              "",
              `**Triggered by:** Monthly cron — run \`${context.runId}\``,
            ].filter(l => l !== undefined).join("\n");
            core.setOutput("title", title);
            core.setOutput("body", body);
            core.setOutput("desired_state", "open");
            core.setOutput("labels_json", JSON.stringify(["data-freshness", "financial-data"]));

      - name: "📝 Sync AFP drift issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}
          labels-json: ${{ steps.issue_payload.outputs.labels_json }}

      - name: "✅ Fail workflow on mismatch"
        if: steps.audit.outputs.outcome == 'failure'
        run: exit 1
