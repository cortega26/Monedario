name: Security Scans

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Start as informational so private-repo scanning can be adopted without
    # blocking every PR on the first rollout.
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "📁 Prepare security report directory"
        run: mkdir -p output/security

      - name: "🔐 Install Gitleaks"
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: "🕵️ Run Gitleaks"
        run: |
          scan_root="${RUNNER_TEMP}/gitleaks-tree"
          rm -rf "${scan_root}"
          mkdir -p "${scan_root}"
          git archive --format=tar HEAD | tar -x -C "${scan_root}"

          gitleaks dir "${scan_root}" \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path output/security/gitleaks.sarif \
            --exit-code 1

      - name: "🧾 Summarize Gitleaks findings"
        if: failure() && hashFiles('output/security/gitleaks.sarif') != ''
        run: |
          jq -r '
            .runs[0].results[]
            | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // "?")"
          ' output/security/gitleaks.sarif

      - name: "📤 Upload Gitleaks artifact"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: gitleaks-report
          retention-days: 14
          if-no-files-found: warn
          path: output/security/gitleaks.sarif

  opengrep:
    name: Static analysis (Opengrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Start as informational because the p/ci ruleset is remote and can evolve
    # independently of repository changes.
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "📁 Prepare security report directory"
        run: mkdir -p output/security

      - name: "🔎 Install Opengrep"
        run: |
          curl -fsSL -o /tmp/opengrep \
            https://github.com/opengrep/opengrep/releases/download/v1.21.0/opengrep_manylinux_x86
          sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep

      - name: "🧠 Run Opengrep"
        run: |
          opengrep scan . \
            --config p/ci \
            --exclude .git \
            --exclude .astro \
            --exclude dist \
            --exclude node_modules \
            --exclude public/pagefind \
            --exclude .venv \
            --exclude output \
            --sarif-output output/security/opengrep.sarif \
            --error

      - name: "📝 Publish Opengrep summary"
        if: always()
        run: |
          if [[ -s output/security/opengrep.sarif ]]; then
            findings=$(jq '[.runs[].results[]?] | length' output/security/opengrep.sarif)
            {
              echo "### Opengrep Findings"
              echo ""
              echo "- Findings: ${findings}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📤 Upload Opengrep artifact"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: opengrep-report
          retention-days: 14
          if-no-files-found: warn
          path: output/security/opengrep.sarif

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Start as informational so the team can triage the initial baseline before
    # deciding which severities should become blocking.
    continue-on-error: true

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "📁 Prepare security report directory"
        run: mkdir -p output/security

      - name: "🛡️ Run Trivy"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          output: output/security/trivy.txt
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          skip-dirs: .git,.astro,dist,node_modules,public/pagefind,.venv,output

      - name: "📝 Publish Trivy summary"
        if: always()
        run: |
          if [[ -s output/security/trivy.txt ]]; then
            {
              echo "### Trivy Findings"
              echo ""
              echo "<details><summary>Expand Trivy output</summary>"
              echo ""
              echo '```text'
              cat output/security/trivy.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📤 Upload Trivy artifact"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: trivy-report
          retention-days: 14
          if-no-files-found: warn
          path: output/security/trivy.txt

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Weekly schedule only: Python deps are auxiliary (MCP server, font tools,
    # scraping). They don't touch the production build path, so per-PR scanning
    # is noise. Weekly catches CVEs without burning CI minutes on every push.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "📁 Prepare security report directory"
        run: mkdir -p output/security

      - name: "🐍 Bootstrap Python workspace"
        uses: ./.github/actions/bootstrap-python
        with:
          python-version: "3.14"

      - name: "🔐 Audit Python dependencies for known CVEs"
        id: audit
        # pip-audit scans the resolved environment against PyPA Advisory Database
        run: |
          set -euo pipefail
          uv run pip-audit --format json --output output/security/python-audit.json --desc on || true

      - name: "📝 Publish Python audit summary"
        if: always()
        run: |
          if [[ -s output/security/python-audit.json ]]; then
            vuln_count=$(jq 'length' output/security/python-audit.json 2>/dev/null || echo "0")
            {
              echo "### Python Dependency Vulnerabilities"
              echo ""
              echo "- Vulnerable packages: ${vuln_count}"
              echo ""
              if [[ "${vuln_count}" -gt 0 ]]; then
                echo "<details><summary>Expand CVE details</summary>"
                echo ""
                echo '```json'
                cat output/security/python-audit.json
                echo '```'
                echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Python Dependency Vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No vulnerabilities found. ✓" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📤 Upload Python audit artifact"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: python-audit-report
          retention-days: 30
          if-no-files-found: warn
          path: output/security/python-audit.json
