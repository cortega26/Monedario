name: Weekly Search Ops

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  weekly-ops:
    name: Prepare weekly search ops bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Install pnpm"
        run: npm install -g pnpm@10.30.2

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🗓️ Compute week label"
        id: week
        run: |
          echo "label=$(node --input-type=module -e "import { previousCompleteISOWeek } from './scripts/data-signals/gsc-utils.mjs'; process.stdout.write(previousCompleteISOWeek());")" >> "$GITHUB_OUTPUT"

      - name: "📁 Initialize weekly bundle"
        run: node scripts/build-weekly-search-report.mjs --input "output/operations/weekly-search-performance/${{ steps.week.outputs.label }}" --init

      - name: "🔎 Detect export availability"
        id: exports
        run: |
          INPUT_DIR="output/operations/weekly-search-performance/${{ steps.week.outputs.label }}"
          GSC_JSON_DIR="output/operations/data-signals/gsc"

          HAS_INDEXATION=false
          HAS_CSV=false
          HAS_JSON=false

          if [ -f "$INPUT_DIR/indexation-summary.json" ]; then
            HAS_INDEXATION=true
          fi

          if [ -f "$INPUT_DIR/gsc-pages.csv" ] && [ -f "$INPUT_DIR/gsc-queries.csv" ]; then
            HAS_CSV=true
          fi

          if [ -f "$GSC_JSON_DIR/${{ steps.week.outputs.label }}-pages.json" ] && [ -f "$GSC_JSON_DIR/${{ steps.week.outputs.label }}-queries.json" ]; then
            HAS_JSON=true
          fi

          if [ "$HAS_INDEXATION" = true ] && [ "$HAS_CSV" = true ]; then
            echo "scorecard_ready=true" >> "$GITHUB_OUTPUT"
            echo "gsc_source=csv" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_INDEXATION" = true ] && [ "$HAS_JSON" = true ]; then
            echo "scorecard_ready=true" >> "$GITHUB_OUTPUT"
            echo "gsc_source=json" >> "$GITHUB_OUTPUT"
          else
            echo "scorecard_ready=false" >> "$GITHUB_OUTPUT"
            echo "gsc_source=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: "📊 Build weekly scorecard"
        if: steps.exports.outputs.scorecard_ready == 'true'
        run: node scripts/build-weekly-search-report.mjs --input "output/operations/weekly-search-performance/${{ steps.week.outputs.label }}"

      - name: "📤 Upload weekly bundle"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-search-ops-${{ steps.week.outputs.label }}
          retention-days: 14
          if-no-files-found: error
          path: output/operations/weekly-search-performance/${{ steps.week.outputs.label }}/

      - name: "📝 Create or update weekly ops issue"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const weekLabel = "${{ steps.week.outputs.label }}";
            const ready = "${{ steps.exports.outputs.scorecard_ready }}" === "true";
            const gscSource = "${{ steps.exports.outputs.gsc_source }}";
            const title = `Weekly search ops: ${weekLabel}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find(issue => issue.title === title);

            const checklist = [
              "- [ ] Confirm Google Search Console pages export",
              "- [ ] Confirm Google Search Console queries export",
              "- [ ] Update indexation-summary.json with Google + Bing status",
              "- [ ] Add analytics-events.csv if available",
              "- [ ] Generate or review weekly scorecard",
              "- [ ] Decide 1-3 next actions",
            ];

            const body = [
              `Weekly search ops bundle prepared for \`${weekLabel}\`.`,
              "",
              `- Bundle path: \`output/operations/weekly-search-performance/${weekLabel}/\``,
              `- Scorecard generated: \`${ready ? "yes" : "no"}\``,
              `- Workflow artifact: \`weekly-search-ops-${weekLabel}\``,
              "",
              "### Checklist",
              ...checklist,
              "",
              ready
                ? gscSource === "json"
                  ? "Repo data signals were available for the previous complete week, so the workflow generated a first-pass scorecard automatically. Review indexation + analytics before closing the checklist."
                  : "The required exports were available, so the workflow generated the scorecard automatically."
                : "The required exports were not available in the workflow workspace. Complete the bundle and rerun the script or workflow.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                labels: ["ops", "search", "weekly"],
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ops", "search", "weekly"],
              });
              core.info(`Created issue #${created.data.number}`);
            }
