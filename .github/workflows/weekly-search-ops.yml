# Cadence: biweekly (even ISO weeks). The cron fires every Monday, but the job
# short-circuits on odd ISO weeks via the "Gate cadence" step below. Rationale:
# at the current traffic volume (~1.4k impressions, single-digit clicks/week) a
# weekly ritual produced more noise than signal; biweekly keeps the same signal
# with half the recurring issues. Manual workflow_dispatch always runs (no gate).
# GitHub cron has no native fortnightly schedule, hence the deterministic guard.
name: Weekly Search Ops

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"

concurrency:
  group: weekly-search-ops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  weekly-ops:
    name: Prepare weekly search ops bundle
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🗓️ Compute week label"
        id: week
        run: |
          echo "label=$(node --input-type=module -e "import { previousCompleteISOWeek } from './scripts/data-signals/gsc-utils.mjs'; process.stdout.write(previousCompleteISOWeek());")" >> "$GITHUB_OUTPUT"

      - name: "🚦 Gate cadence (biweekly on even ISO weeks)"
        id: cadence
        run: |
          # Manual dispatch always proceeds; scheduled runs only on even ISO weeks.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding."
          else
            WEEK_NUM=$(printf '%s' "${{ steps.week.outputs.label }}" | sed -E 's/.*-W0*([0-9]+)/\1/')
            if [ $((WEEK_NUM % 2)) -eq 0 ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "ISO week $WEEK_NUM is even — proceeding (biweekly cadence)."
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "ISO week $WEEK_NUM is odd — skipping (biweekly cadence)."
            fi
          fi

      - name: "📁 Initialize weekly bundle"
        if: steps.cadence.outputs.proceed == 'true'
        run: node scripts/build-weekly-search-report.mjs --input "output/operations/weekly-search-performance/${{ steps.week.outputs.label }}" --init

      - name: "🔎 Detect export availability"
        id: exports
        if: steps.cadence.outputs.proceed == 'true'
        run: |
          INPUT_DIR="output/operations/weekly-search-performance/${{ steps.week.outputs.label }}"
          GSC_JSON_DIR="output/operations/data-signals/gsc"

          HAS_INDEXATION=false
          HAS_CSV=false
          HAS_JSON=false

          if [ -f "$INPUT_DIR/indexation-summary.json" ]; then
            HAS_INDEXATION=true
          fi

          if [ -f "$INPUT_DIR/gsc-pages.csv" ] && [ -f "$INPUT_DIR/gsc-queries.csv" ]; then
            HAS_CSV=true
          fi

          if [ -f "$GSC_JSON_DIR/${{ steps.week.outputs.label }}-pages.json" ] && [ -f "$GSC_JSON_DIR/${{ steps.week.outputs.label }}-queries.json" ]; then
            HAS_JSON=true
          fi

          if [ "$HAS_INDEXATION" = true ] && [ "$HAS_CSV" = true ]; then
            echo "scorecard_ready=true" >> "$GITHUB_OUTPUT"
            echo "gsc_source=csv" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_INDEXATION" = true ] && [ "$HAS_JSON" = true ]; then
            echo "scorecard_ready=true" >> "$GITHUB_OUTPUT"
            echo "gsc_source=json" >> "$GITHUB_OUTPUT"
          else
            echo "scorecard_ready=false" >> "$GITHUB_OUTPUT"
            echo "gsc_source=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: "📊 Build weekly scorecard"
        if: steps.cadence.outputs.proceed == 'true' && steps.exports.outputs.scorecard_ready == 'true'
        run: node scripts/build-weekly-search-report.mjs --input "output/operations/weekly-search-performance/${{ steps.week.outputs.label }}"

      - name: "📤 Upload weekly bundle"
        if: steps.cadence.outputs.proceed == 'true'
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: weekly-search-ops-${{ steps.week.outputs.label }}
          retention-days: 14
          path: output/operations/weekly-search-performance/${{ steps.week.outputs.label }}/

      - name: "📝 Build weekly ops issue payload"
        if: steps.cadence.outputs.proceed == 'true'
        id: issue_payload
        shell: bash
        env:
          WEEK_LABEL: ${{ steps.week.outputs.label }}
          SCORECARD_READY: ${{ steps.exports.outputs.scorecard_ready }}
          GSC_SOURCE: ${{ steps.exports.outputs.gsc_source }}
        run: |
          set -euo pipefail

          title="Weekly search ops: $WEEK_LABEL"
          scorecard_generated="no"
          status_line="The required exports were not available in the workflow workspace. Complete the bundle and rerun the script or workflow."

          if [[ "$SCORECARD_READY" == "true" ]]; then
            scorecard_generated="yes"

            if [[ "$GSC_SOURCE" == "json" ]]; then
              status_line="Repo data signals were available for the previous complete week, so the workflow generated a first-pass scorecard automatically. Review indexation + analytics before closing the checklist."
            else
              status_line="The required exports were available, so the workflow generated the scorecard automatically."
            fi
          fi

          {
            echo 'title<<__ISSUE_TITLE__'
            echo "$title"
            echo '__ISSUE_TITLE__'
            echo 'body<<__ISSUE_BODY__'
            printf '%s\n' \
              "Weekly search ops bundle prepared for \`$WEEK_LABEL\`." \
              "" \
              "- Bundle path: \`output/operations/weekly-search-performance/$WEEK_LABEL/\`" \
              "- Scorecard generated: \`$scorecard_generated\`" \
              "- Workflow artifact: \`weekly-search-ops-$WEEK_LABEL\`" \
              "" \
              "### Checklist" \
              "- [ ] Confirm Google Search Console pages export" \
              "- [ ] Confirm Google Search Console queries export" \
              "- [ ] Update indexation-summary.json with Google + Bing status" \
              "- [ ] Generate or review weekly scorecard" \
              "- [ ] Decide 1-3 next actions" \
              "" \
              "_Deferred until traffic warrants it (>~100 clicks/week): \`analytics-events.csv\` on-site behavior analysis. At current volume GSC signal drives the decisions — see the ritual runbook._" \
              "" \
              "$status_line"
            echo '__ISSUE_BODY__'
            echo 'desired_state=open'
            echo 'labels_json=["ops","search","weekly"]'
          } >> "$GITHUB_OUTPUT"

      - name: "📝 Sync weekly ops issue"
        if: steps.cadence.outputs.proceed == 'true'
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}
          labels-json: ${{ steps.issue_payload.outputs.labels_json }}
