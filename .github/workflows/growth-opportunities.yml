name: Growth opportunities (report-only)

# Fase 0 del Growth Engine: detecta oportunidades desde los data-signals ya
# commiteados (GSC + analytics first-party) y publica un issue de reporte.
# No modifica contenido, no abre PRs y no toca rutas.
# Contrato: docs/operations/GROWTH-ENGINE.md

on:
  workflow_dispatch:
  schedule:
    # Lunes 09:40 UTC, después de data-signals (06:00) y weekly-search-ops (08:15)
    - cron: "40 9 * * 1"

concurrency:
  group: growth-opportunities-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Detectar oportunidades (report-only)
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: "🔎 Recolectar queries de Bing Webmaster (fuente libre)"
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/collect-bing-queries.mjs

      - name: "📡 Recolectar sitemaps de competidores (fuente libre)"
        continue-on-error: true
        run: node scripts/collect-competitor-sitemaps.mjs

      - name: "🧾 Extraer firma previa del issue"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const title = "🌱 Growth opportunities (report-only)";
            const { owner, repo } = context.repo;
            const dir = "output/validation/growth-opportunities";
            fs.mkdirSync(dir, { recursive: true });
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (!existing?.body) {
              core.info("Sin issue previo; primera corrida sin delta");
              return;
            }
            const match = existing.body.match(
              /<!-- growth-signature: ([\s\S]*?) -->/
            );
            if (!match) {
              core.info("Sin firma previa en el issue");
              return;
            }
            try {
              const signature = JSON.parse(match[1]);
              fs.writeFileSync(
                `${dir}/previous-signature.json`,
                JSON.stringify(signature)
              );
              core.info(
                `Firma previa ${signature.week} (${signature.ids?.length ?? 0} candidatos)`
              );
            } catch (error) {
              core.warning(`Firma previa inválida: ${error.message}`);
            }

      - name: "🌱 Detectar oportunidades"
        run: |
          if [ -f output/validation/growth-opportunities/previous-signature.json ]; then
            node scripts/detect-seo-opportunities.mjs \
              --previous-signature output/validation/growth-opportunities/previous-signature.json
          else
            node scripts/detect-seo-opportunities.mjs
          fi

      - name: "📤 Upload opportunity report"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: growth-opportunities-report
          retention-days: 30
          if-no-files-found: warn
          path: output/validation/growth-opportunities/

      - name: "📝 Publicar issue de oportunidades"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const dir = "output/validation/growth-opportunities";
            if (!fs.existsSync(dir)) {
              core.info("No hay reporte de oportunidades");
              return;
            }
            const files = fs
              .readdirSync(dir)
              .filter((file) => file.endsWith(".md"))
              .sort();
            if (files.length === 0) {
              core.info("No hay markdown de oportunidades");
              return;
            }
            const latest = files[files.length - 1];
            const body = fs.readFileSync(`${dir}/${latest}`, "utf8");
            const reportFiles = fs
              .readdirSync(dir)
              .filter(
                (file) =>
                  file.endsWith(".json") && file !== "previous-signature.json"
              )
              .sort();
            let marker = "";
            if (reportFiles.length > 0) {
              try {
                const report = JSON.parse(
                  fs.readFileSync(
                    `${dir}/${reportFiles[reportFiles.length - 1]}`,
                    "utf8"
                  )
                );
                if (report.signature) {
                  marker = `\n\n<!-- growth-signature: ${JSON.stringify(report.signature)} -->`;
                }
              } catch (error) {
                core.warning(`No se pudo leer la firma nueva: ${error.message}`);
              }
            }
            const title = "🌱 Growth opportunities (report-only)";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const footer = `\n\n---\n_Reporte automático Fase 0 (sin acciones). Run: ${runUrl}_`;
            const fullBody = body + footer + marker;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body: fullBody,
              });
              core.info(`Issue actualizado: #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: fullBody,
                labels: ["automation", "search"],
              });
              core.info("Issue de oportunidades creado");
            }
