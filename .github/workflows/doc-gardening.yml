name: Doc Gardening

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 4"

concurrency:
  group: doc-gardening-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit docs and mechanical drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "📚 Check context"
        id: check_context
        uses: ./.github/actions/run-command-with-log
        with:
          command: pnpm run check:context
          log-path: output/validation/doc-gardening/check-context.log

      - name: "🗂️ Check docs structure"
        id: check_docs
        uses: ./.github/actions/run-command-with-log
        with:
          command: pnpm run check:docs
          log-path: output/validation/doc-gardening/check-docs.log

      - name: "🔎 Lint"
        id: lint
        uses: ./.github/actions/run-command-with-log
        with:
          command: pnpm run lint
          log-path: output/validation/doc-gardening/lint.log

      - name: "📝 Format check"
        id: format_check
        uses: ./.github/actions/run-command-with-log
        with:
          command: pnpm run format:check
          log-path: output/validation/doc-gardening/format-check.log

      - name: "📤 Upload doc-gardening logs"
        if: always()
        uses: ./.github/actions/upload-workflow-artifact
        with:
          artifact-name: doc-gardening-logs
          retention-days: 14
          path: output/validation/doc-gardening/

      - name: "📝 Build doc-gardening issue payload"
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: issue_payload
        with:
          script: |
            const title = "Doc gardening audit: repo drift detected";
            const checks = [
              { id: "check_context", label: "check:context", outcome: "${{ steps.check_context.outputs.outcome }}" },
              { id: "check_docs", label: "check:docs", outcome: "${{ steps.check_docs.outputs.outcome }}" },
              { id: "lint", label: "lint", outcome: "${{ steps.lint.outputs.outcome }}" },
              { id: "format_check", label: "format:check", outcome: "${{ steps.format_check.outputs.outcome }}" },
            ];
            const failed = checks.filter(item => item.outcome === "failure");

            if (failed.length === 0) {
              core.setOutput("title", title);
              core.setOutput("desired_state", "closed");
              core.setOutput("labels_json", JSON.stringify(["docs", "automation", "maintenance"]));
              return;
            }

            const body = [
              "Automated doc-gardening detected repo drift that should be cleaned up in a small follow-up.",
              "",
              "### Failed checks",
              ...failed.map(item => `- \`${item.label}\``),
              "",
              "### Next step",
              "",
              "Open the `doc-gardening-logs` artifact, fix one small cluster of drift, and keep the cleanup PR reviewable in under a minute.",
            ].join("\n");

            core.setOutput("title", title);
            core.setOutput("body", body);
            core.setOutput("desired_state", "open");
            core.setOutput("labels_json", JSON.stringify(["docs", "automation", "maintenance"]));

      - name: "📝 Sync doc-gardening issue"
        if: always()
        uses: ./.github/actions/upsert-issue-by-title
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.issue_payload.outputs.title }}
          body: ${{ steps.issue_payload.outputs.body }}
          desired-state: ${{ steps.issue_payload.outputs.desired_state }}
          labels-json: ${{ steps.issue_payload.outputs.labels_json }}

      - name: "✅ Fail workflow on detected drift"
        if: steps.check_context.outputs.outcome == 'failure' || steps.check_docs.outputs.outcome == 'failure' || steps.lint.outputs.outcome == 'failure' || steps.format_check.outputs.outcome == 'failure'
        run: exit 1
