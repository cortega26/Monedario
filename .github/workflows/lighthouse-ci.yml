name: Lighthouse CI

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Performance audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🔬 Run Lighthouse CI"
        run: pnpm run perf:ci
