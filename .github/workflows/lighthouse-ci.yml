name: Lighthouse CI

on:
  schedule:
    # Thursday 10:00 UTC (moved from Monday to spread weekly load)
    - cron: "0 10 * * 4"
  workflow_dispatch:

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Performance audit
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🔬 Run Lighthouse CI"
        run: pnpm run perf:ci
