name: Lighthouse CI

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Performance audit
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🔬 Run Lighthouse CI"
        run: pnpm run perf:ci
