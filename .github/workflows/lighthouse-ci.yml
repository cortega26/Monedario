name: Lighthouse CI

on:
  schedule:
    # Thursday 10:00 UTC (moved from Monday to spread weekly load)
    - cron: "0 10 * * 4"
  workflow_dispatch:

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Performance audit
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-24.04' }}
    # Build + desktop (5 URLs × 3) + mobile CPU-4x (5 URLs × 3): los collects
    # suman ~7 min en local y más en runners compartidos; 15 min era al límite.
    timeout-minutes: 30

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Bootstrap pnpm workspace"
        uses: ./.github/actions/bootstrap-pnpm
        with:
          node-version: 22

      - name: "🏗️ Build static output"
        run: pnpm run astro build

      - name: "🛡️ Allow unprivileged user namespaces (Chrome sandbox)"
        # Ubuntu 24.04 runner images restrict unprivileged user namespaces by
        # default (AppArmor), which breaks Chrome's own sandbox and makes
        # Lighthouse's headless launch fail with "No usable sandbox!".
        # Restoring the kernel setting keeps Chrome's sandbox enabled instead
        # of disabling it via --no-sandbox. GitHub-hosted only: if
        # ACTIONS_RUNNER_LABEL ever routes this job back to the self-hosted
        # bridge (docs/operations/runbooks/actions-quota-bridge.md), its
        # container runs as UID 10001 without general sudo and this would
        # fail before the audit even starts.
        if: runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: "🔬 Run Lighthouse CI"
        run: pnpm run perf:ci

      - name: "📱 Lighthouse CI — mobile (warn-only, scheduled)"
        # Telemetría no-bloqueante: el throttling CPU-4x móvil en runners
        # compartidos es flaky como gate. Los umbrales objetivo (perf ≥ 0.8,
        # LCP ≤ 2500, CLS ≤ 0.1) están en lighthouserc.mobile.cjs. Corre
        # SIEMPRE (if: always) para que la telemetría mobile no se pierda
        # cuando el run desktop falla (p. ej. el flake de CLS sub-pixel).
        if: always()
        run: pnpm run perf:ci:mobile
        continue-on-error: true
