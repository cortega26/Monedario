allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  undici: '>=7.28.0'
  tmp: '>=0.2.6'
  yaml: '>=2.8.3'
  qs: '>=6.16.0'
  fast-uri: '>=3.1.6'
  esbuild: '>=0.28.1'
  shiki: 4.3.1
  # Activo (intencional desde #305): los rangos viejos de js-yaml se fuerzan a
  # v4 (API unificada) mientras el root usa v5. No eliminar sin re-evaluar.
  # Seguridad (2026-09-13): 4.3.1→4.3.2 por GHSA-2883-xcg3-v3hh (alerta #114,
  # maxTotalMergeKeys no limita CPU). Pineado exacto, no rango.
  js-yaml@^3.13.1: 4.3.2
  js-yaml@^4.1.1: 4.3.2
  uuid: '>=11.1.1'
  # Seguridad (2026-09-13): pines transitivos con CVE cuyo padre no publica
  # release que los corrija — se fuerzan al parcheado.
  # - fflate <0.7.5→0.7.5 por GHSA-px8p-9vwx-vf98 (alerta #115, ZIP64 loop);
  #   satori@0.33.4 (último publicado) pinea 0.7.3 exacto.
  #   remove-when: satori publique release que resuelva fflate >=0.7.5.
  # - sharp <0.35.4→0.35.4 por GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545
  #   (alerta #113, libheif); lo pinea miniflare vía wrangler@4.127.1.
  #   remove-when: wrangler/miniflare publique release que resuelva sharp
  #   >=0.35.4.
  # Revisar al subir satori/wrangler: quitar la línea cuyo padre ya resuelva
  # el parcheado, correr `pnpm install` y conservar si el lockfile queda limpio.
  # Aserción lockfile: lo resuelto debe seguir siendo fflate 0.7.5 y
  # sharp 0.35.4 (`pnpm why fflate sharp`); si un bump paterno mueve la
  # resolución, re-evaluar el pin en vez de asumir que sigue cubriendo.
  fflate@<0.7.5: 0.7.5
  sharp@<0.35.4: 0.35.4
minimumReleaseAge: 10080
# Transitional, version-pinned exceptions for packages already trusted in the
# lockfile before the seven-day policy was enabled. Future releases remain
# subject to minimumReleaseAge and these entries can be removed after aging out.
# Cohortes 2026-09-07..12 retiradas el 2026-09-25 tras madurar (TD-0097);
# el lockfile pasa la política sin ellas.
# Sin excepciones vivas al 2026-09-30 (TD-0104): las 2 últimas
# (`eslint-plugin-astro@2.1.1`, `postcss@8.5.25`) ya no existían en el
# lockfile y fueron retiradas; `check:pnpm-release-age-excludes` impide que se
# acumulen entradas muertas otra vez.
minimumReleaseAgeExclude: []
