allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  undici: '>=7.28.0'
  tmp: '>=0.2.6'
  yaml: '>=2.8.3'
  qs: '>=6.16.0'
  fast-uri: '>=3.1.6'
  esbuild: '>=0.28.1'
  shiki: 4.3.1
  # Activo (intencional desde #305): los rangos viejos de js-yaml se fuerzan a
  # v4 (API unificada) mientras el root usa v5. No eliminar sin re-evaluar.
  js-yaml@^3.13.1: 4.3.1
  js-yaml@^4.1.1: 4.3.1
  uuid: '>=11.1.1'
minimumReleaseAge: 10080
# Transitional, version-pinned exceptions for packages already trusted in the
# lockfile before the seven-day policy was enabled. Future releases remain
# subject to minimumReleaseAge and these entries can be removed after aging out.
minimumReleaseAgeExclude:
  # Seguridad (2026-08-09): nanoid 3.3.17 corrige GHSA-2v37-7h3g-55p8. Esta
  # excepción vence al cumplir los siete días de maduración (2026-08-10).
  # Seguridad (2026-08-03): fast-uri 3.1.5 (parche forzado por override),
  # transitoria — removible desde 2026-08-07 junto con el override.
  # Seguridad (2026-09-04): qs 6.16.0 corrige GHSA (array-limit bypass,
  # alertas Dependabot #104). Publicado 2026-08-29; excepción transitoria
  # hasta madurar los siete días — removible desde 2026-09-05.
  # NOTA (2026-09-12): pnpm evalúa minimumReleaseAgeExclude con first-match-wins
  # por nombre — dos entradas del mismo paquete NO se suman. Por eso 1.2.2 y
  # 1.2.4 van en unión `||` en una sola línea (removible desde ~2026-09-18).
  - '@napi-rs/wasm-runtime@1.2.2 || 1.2.4'
  - 'eslint-plugin-astro@2.1.1'
  - 'js-yaml@5.2.3'
  - 'postcss@8.5.25'
  - 'qs@6.16.0'
  # Transitoria (2026-09-12): bumps del 2026-09-11 (sharp 0.35.4 vía PR #472 +
  # runtime-group) publicaron 19 transitivas el 2026-09-07/09/10, dentro de la
  # ventana de siete días. Removible cuando maduren (~2026-09-17/18): quitar
  # las líneas, correr `pnpm install --frozen-lockfile`, conservar solo si sale 0.
  - '@oxc-project/types@0.149.0'
  - '@rolldown/binding-android-arm-eabi@1.2.8'
  - '@rolldown/binding-android-arm64@1.2.8'
  - '@rolldown/binding-darwin-arm64@1.2.8'
  - '@rolldown/binding-darwin-x64@1.2.8'
  - '@rolldown/binding-freebsd-x64@1.2.8'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.8'
  - '@rolldown/binding-linux-arm64-gnu@1.2.8'
  - '@rolldown/binding-linux-arm64-musl@1.2.8'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.8'
  - '@rolldown/binding-linux-s390x-gnu@1.2.8'
  - '@rolldown/binding-linux-x64-gnu@1.2.8'
  - '@rolldown/binding-linux-x64-musl@1.2.8'
  - '@rolldown/binding-openharmony-arm64@1.2.8'
  - '@rolldown/binding-win32-arm64-msvc@1.2.8'
  - '@rolldown/binding-win32-x64-msvc@1.2.8'
  - 'nanoid@3.3.19'
  - 'rolldown@1.2.8'
