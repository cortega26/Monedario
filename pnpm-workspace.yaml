allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  # Astro 7.4.7's @astrojs/check resolves @emnapi/runtime 2.0.0-beta.2,
  # which crashes `astro check` (deleteEnv is not a function). Pin the
  # stable 1.11.3 used by the current lockfile until upstream fixes it.
  '@emnapi/runtime': 1.11.3
  # Mantener separadas las líneas mayores de undici: Miniflare/Wrangler usa
  # 7.x; los consumidores 8.x se fijan después de la regresión HTTP/2 de
  # 8.11.0 (nodejs/undici#5858; workers-sdk#15811).
  'undici@>=8 <9': 8.11.2
  tmp: '>=0.2.6'
  yaml: '>=2.8.3'
  qs: '>=6.16.0'
  fast-uri: '>=3.1.6'
  esbuild: '>=0.28.1'
  # Astro bundlea `shiki` 4.3.1. `@shikijs/transformers` (devDependency directa)
  # se pina exacto a esa misma versión en package.json: si avanza por su cuenta,
  # pnpm resuelve dos copias de `@shikijs/types` y `astro check` falla con
  # TS2322 en `astro.config.ts` (el ShikiTransformer de una copia no es
  # asignable al de la otra). Al subir Astro hay que subir este pin y el de
  # `@shikijs/transformers` juntos; lo exige
  # `tests/static-analysis/shiki-single-type-identity.e2e.test.ts`.
  shiki: 4.3.1
  # Activo (intencional desde #305): los rangos viejos de js-yaml se fuerzan a
  # v4 (API unificada) mientras el root usa v5. No eliminar sin re-evaluar.
  # Seguridad (2026-09-13): 4.3.1→4.3.2 por GHSA-2883-xcg3-v3hh (alerta #114,
  # maxTotalMergeKeys no limita CPU). Pineado exacto, no rango.
  js-yaml@^3.13.1: 4.3.2
  js-yaml@^4.1.1: 4.3.2
  uuid: '>=11.1.1'
  # Seguridad (2026-10-19): advisories abiertas en dependencias transitivas.
  # - source-map-js <1.2.2: event-loop DoS por section offsets (alerta #210).
  # - proxy-addr <2.0.8: IP spoofing vía IPv4-mapped IPv6 (alerta #209, dev).
  # - compression <1.8.2: DoS por memory leak al cerrar respuesta (alerta #208, dev).
  # - postcss-selector-parser <7.1.6: CPU exhaustion en selectores planos
  #   (alerta #207, build-time vía @tailwindcss/typography).
  source-map-js: '>=1.2.2'
  proxy-addr: '>=2.0.8'
  compression: '>=1.8.2'
  postcss-selector-parser: '>=7.1.6'
  # Astro 7.3.8 ya pide devalue/smol-toml parcheados, pero @astrojs/react 6
  # mantiene copias viejas de internal-helpers. Se fuerzan aquí hasta D2
  # (@astrojs/react 7) y se revisan en el próximo bump.
  devalue: '>=5.9.4'
  smol-toml: '>=1.9.0'
  http-cache-semantics: '>=4.2.1'
  # El root y miniflare ya usan sharp 0.35.5; el optional dep de astro pedía
  # 0.35.4. Forzar el parcheado elimina la alerta #212.
  sharp: '>=0.35.5'
  # basic-ftp 6.x mantiene la API Client/access/list que usa get-uri 6.0.5.
  # Solo llega por LHCI/puppeteer (dev); el override elimina la alerta #189.
  basic-ftp: '>=6.2.3'
  # Seguridad (2026-09-13): pines transitivos con CVE cuyo padre no publica
  # release que los corrija — se fuerzan al parcheado.
  # - fflate <0.7.5→0.7.5 por GHSA-px8p-9vwx-vf98 (alerta #115, ZIP64 loop);
  #   satori@0.33.4 (último publicado) pinea 0.7.3 exacto.
  #   remove-when: satori publique release que resuelva fflate >=0.7.5.
  # - sharp: el pin <0.35.4→0.35.4 se retira el 2026-10-19 porque
  #   wrangler@4.149/miniflare ya resuelve sharp 0.35.5 y el root sube a
  #   sharp 0.35.5. Si `pnpm why sharp` muestra una versión menor, re-evaluar.
  # Revisar al subir satori/wrangler: quitar la línea cuyo padre ya resuelva
  # el parcheado, correr `pnpm install` y conservar si el lockfile queda limpio.
  fflate@<0.7.5: 0.7.5
minimumReleaseAge: 10080
# Transitional, version-pinned exceptions for packages already trusted in the
# lockfile before the seven-day policy was enabled. Future releases remain
# subject to minimumReleaseAge and these entries can be removed after aging out.
# Cohortes 2026-09-07..12 retiradas el 2026-09-25 tras madurar (TD-0097);
# el lockfile pasa la política sin ellas.
# Sin excepciones vivas al 2026-09-30 (TD-0104): las 2 últimas
# (`eslint-plugin-astro@2.1.1`, `postcss@8.5.25`) ya no existían en el
# lockfile y fueron retiradas; `check:pnpm-release-age-excludes` impide que se
# acumulen entradas muertas otra vez.
minimumReleaseAgeExclude: []
