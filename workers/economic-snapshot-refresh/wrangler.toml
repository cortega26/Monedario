name = "monedario-economic-snapshot-refresh"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

[triggers]
# Three daily triggers for self-healing. All runs are idempotent (payload-diff
# check ignores capturedAt), so a successful early run makes the later ones
# no-ops. If 10:15 fails, 14:15 retries; if both fail, 18:15 is the last chance
# before tomorrow's window. See ADR-20260516 §"auto-trigger on missed updates".
crons = ["15 10 * * *", "15 14 * * *", "15 18 * * *"]

[vars]
REPO_OWNER = "cortega26"
REPO_NAME = "Monedario"
TARGET_BRANCH = "main"
TARGET_PATH = "src/infrastructure/economic/economic-parameters.snapshot.json"
COMMIT_AUTHOR_NAME = "monedario-snapshot-bot"
COMMIT_AUTHOR_EMAIL = "noreply+snapshot-bot@monedario.cl"
COMMIT_MESSAGE = "chore(editorial): refresh economic snapshot (worker)"
MINDICADOR_TIMEOUT_MS = "12000"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN   — fine-grained PAT, repo cortega26/Monedario, Contents: Read & Write
#   BCCH_USER      — Banco Central SiETE account email (optional; without it UF/USD use mindicador.cl)
#   BCCH_PASSWORD  — Banco Central SiETE password
