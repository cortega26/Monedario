name = "monedario-analytics-collector"
main = "src/worker-v2.ts"
compatibility_date = "2026-06-28"
workers_dev = true

# ── Route ───────────────────────────────────────────────────────────────────
# El worker sirve únicamente el endpoint de analytics.
# Endpoint público: POST https://monedario.cl/api/analytics/event
[[routes]]
pattern = "monedario.cl/api/analytics/*"
zone_id = "9d53871bed75e9ad5d4cc5da84a18fcf"

# ── Triggers ────────────────────────────────────────────────────────────────
# Cron semanal: exporta agregados históricos KV + contadores SQLite → R2.
# Lunes 05:30 UTC, antes del fetch de data-signals de las 06:00 UTC.
[triggers]
crons = ["30 5 * * MON"]

# ── Legacy KV (read-only after 2026-09-11 migration) ───────────────────────
# Historical counters remain readable until their existing TTL expires.
# New ingestion MUST NOT write to this namespace.
[[kv_namespaces]]
binding = "ANALYTICS_TELEMETRY"
id = "f9de0048ca334578805b5bdd55bc71e0"

# ── Native Workers Rate Limiting ───────────────────────────────────────────
# Replaces the former KV get+put limiter, eliminating one KV write per event.
[[ratelimits]]
name = "ANALYTICS_RATE_LIMITER"
namespace_id = "26091101"

  [ratelimits.simple]
  limit = 30
  period = 60

# ── Atomic counter storage ─────────────────────────────────────────────────
# One deterministic Durable Object instance stores aggregated counters in
# SQLite. Atomic UPSERT removes KV's read-modify-write race and 1,000-write/day
# account limit from the hot ingestion path.
[[durable_objects.bindings]]
name = "ANALYTICS_COUNTERS"
class_name = "AnalyticsCounters"

[exports.AnalyticsCounters]
type = "durable-object"
storage = "sqlite"

# ── R2 Bucket (weekly exports) ──────────────────────────────────────────────
[[r2_buckets]]
binding = "ANALYTICS_EXPORTS"
bucket_name = "monedario-analytics-exports"

# ── Environment variables ───────────────────────────────────────────────────
[vars]
SCHEMA_VERSION = "2"
EXPORT_TIMEZONE = "America/Santiago"

# Historical KV key-format cutover. Still required to read the correct legacy
# prefix while old KV counters remain within their TTL.
COUNTER_KEY_CUTOVER_AT = "2026-07-20T04:00:00Z"

MAX_BODY_SIZE = "2048"
ALLOWED_ORIGIN = "https://monedario.cl"

# Root-cause fix: ingestion is re-enabled only after the deploy workflow passes
# focused tests + Wrangler dry-run. New writes go to SQLite DO, never KV.
ANALYTICS_DISABLED = "0"

[observability]
enabled = true

# ── Secrets ─────────────────────────────────────────────────────────────────
# EXPORT_SECRET protects GET /api/analytics/export via Authorization: Bearer.
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are supplied by GitHub Actions
# to deployment tooling, not exposed as Worker bindings.
