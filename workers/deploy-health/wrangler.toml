name = "monedario-deploy-health"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

# No cron trigger: Workers Free caps the account at 5 cron triggers and they
# are already in use. The `deploy-health` GitHub workflow runs every 6 h and
# calls GET /status, which executes the checks on demand.

[vars]
SITE_URL = "https://monedario.cl/"
HEALTH_URL = "https://monedario.cl/api/deploy-health.json"

[observability]
enabled = true
