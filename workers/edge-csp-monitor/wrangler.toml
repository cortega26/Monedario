name = "monedario-edge-csp-monitor"
main = "src/index.mjs"
compatibility_date = "2026-10-15"
workers_dev = true

[triggers]
# UTC. Six low-cost browser requests/day, no GitHub Actions minutes.
crons = ["15 09,21 * * *"]

[browser]
binding = "BROWSER"

[vars]
# Active since 2026-10-15 after successful 3/3 real Browser Run baseline.
# Keep GitHub issue token as a Worker secret: never commit the token.
MONITOR_MODE = "active"

[observability]
enabled = true

# Secret: EDGE_MONITOR_GITHUB_TOKEN (repo Monedario, Issues Read/Write only).
