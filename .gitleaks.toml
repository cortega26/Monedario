[extend]
useDefault = true

[allowlist]
description = "Ignore local/generated files and known false positives."
paths = [
  '''(^|/)\.claude/''',
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)output/playwright/''',
  '''(^|/)output/security/''',
  # Known false positives:
  # - decisionWizards.ts: resultKey strings detected as generic-api-key
  # - autor.astro: Web3Forms public UUID for contact form
  '''(^|/)src/config/decisionWizards\.ts$''',
  '''(^|/)src/pages/autor\.astro$''',
]
