successSignal: "Un lector sin boletas obligatorias (freelance bajo el umbral, socio con retiros/dividendos, persona sin actividad remunerada formal) entiende si califica como afiliado voluntario, cuanto cotizaria como minimo con un ejemplo numerico verificado, y sale con una decision clara sobre si afiliarse o no, sin confundir este mecanismo con la cotizacion obligatoria de boletas ya cubierta en boleta-honorarios. CORREGIDO tras 02-dossier.md (2026-09-17): el gancho NO es 'elegibilidad a PGU' (verificado que la PGU es no contributiva y no exige historial de cotizaciones, fuente spensiones.cl) sino continuidad de pension propia + acceso condicional al SIS (requiere haber cotizado el mes calendario anterior al siniestro). El lector tambien debe salir distinguiendo que la cotizacion de salud (Fonasa/Isapre, 7%) es un tramite APARTE de la afiliacion voluntaria en AFP, y que 'cotizacion voluntaria' NO es lo mismo que el aporte adicional tipo APV/Cuenta 2 de quien ya cotiza obligatoriamente (ver glosario cuenta-2.md) — desambiguar desde el primer parrafo relevante."
