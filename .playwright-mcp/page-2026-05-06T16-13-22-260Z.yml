      - paragraph [ref=e89]: El Impuesto Único de Segunda Categoría a los Sueldos, Salarios y Pensiones es un tributo progresivo que se paga mensualmente por todas aquellas personas que perciben rentas del desarrollo de una actividad laboral ejercida en forma dependiente y cuyo monto excede mensualmente las 13,5 UTM.
      - paragraph [ref=e90]: En la siguiente tabla se presentan los porcentajes de impuesto efectivos, a aplicar dependiendo del tramo en el que se encuentre el contribuyente de acuerdo a su renta y el monto que resulta al aplicar estos porcentajes sobre los tramos de renta presentados.
