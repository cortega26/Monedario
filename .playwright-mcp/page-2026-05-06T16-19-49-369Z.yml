                          - generic [ref=e325]:
                            - generic [ref=e326]: "Artículo 6.°- Son atribuciones y deberes del Consejo:"
                            - generic [ref=e327]: 1.- Pronunciarse sobre la conveniencia de declarar Monumentos Nacionales los lugares, ruinas, construcciones u objetos que estime del caso y solicitar de la autoridad competente la dictación del decreto supremo correspondiente.
                            - generic [ref=e328]:
                              - text: 2.- El
                              - link "Ley 21045 Art. 42 N° 3 D.O. 03.11.2017" [ref=e330] [cursor=pointer]:
                                - /url: navegar?idNorma=1110097&idParte=9845578&idVersion=2017-11-03
                                - text: Ley 21045
                                - text: Art. 42 N° 3
                                - text: D.O. 03.11.2017
                              - text: iminado.
                            - generic [ref=e331]: 3.- Elaborar los proyectos o normas de restauración, reparación, conservación y señalización de los Monumentos Nacionales y entregar los antecedentes a la Dirección de Arquitectura del Ministerio de Obras Públicas y Transportes para la ejecución, de común acuerdo, de los trabajos correspondientes, sin perjuicio de las obras que el Consejo pudiera realizar por sí mismo o por intermedio de otro organismo y para cuyo financiamiento se consultaren o se recibieren fondos especiales del Presupuesto de la Nación o de otras fuentes.
                            - generic [ref=e332]: 4.- Gestionar la reivindicación o la cesión o venta al Estado o la adquisición a cualquier título por éste, de los Monumentos Nacionales que sean de propiedad particular.
                            - generic [ref=e333]: 5.- Reglamentar el acceso a los Monumentos Nacionales y aplicar o, en su defecto, proponer al Gobierno las medidas administrativas que sean conducentes a la mejor vigilancia y conservación de los mismos.
                            - generic [ref=e334]: 6.- Conceder los permisos o autorizaciones para excavaciones de carácter histórico, arqueológico, antropológico o paleontológico en cualquier punto del territorio nacional, que soliciten las personas naturales o jurídicas chilenas o extranjeras en la forma que détermine el Reglamento, y
                            - generic [ref=e335]: 7.- Proponer al Gobierno el o los Reglamentos que deban dictarse para el cumplimiento de la presente ley.
                        - generic [ref=e336]:
                          - text:  
                          - generic [ref=e338]:
                            - generic [ref=e339]: "Artículo 7.°- El Consejo de Monumentos Nacionales queda asimismo facultado para:"
                            - generic [ref=e340]: 1.- Editar o publicar monografías u otros trabajos sobre los Monumentos Nacionales.
                            - generic [ref=e341]: 2.- Organizar exposiciones como medio de difusión cultural del patrimonio histórico, artístico y científico que le corresponde custodiar.
