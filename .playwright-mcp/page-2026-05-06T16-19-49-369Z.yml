                            - generic [ref=e242]: LEGISLA SOBRE MONUMENTOS NACIONALES; MODIFICA LAS LEYES 16.617 Y 16.719; DEROGA EL DECRETO LEY 651, DE 17 DE OCTUBRE DE 1925
                            - generic [ref=e243]: Por cuanto el Congreso Nacional ha tenido a bien prestar su aprobación al siguiente
                            - generic [ref=e244]: "PROYECTO DE LEY:"
                        - generic [ref=e245]:
                          - text:  
                          - generic [ref=e247]:
                            - generic [ref=e248]: "\"TITULO I"
                            - generic [ref=e249]: De los monumentos nacionales.
                        - generic [ref=e250]:
                          - text:  
                          - generic:
                            - generic [ref=e252] [cursor=pointer]: 
                            - text: 
                          - generic [ref=e255]: Artículo 1.°- Son monumentos nacionales y quedan bajo la tuición y protección del Estado, los lugares, ruinas, construcciones u objetos de carácter histórico o artístico; los enterratorios o cementerios u otros restos de los aborígenes, las piezas u objetos antropo-arqueológicos, paleontológicos o de formación natural, que existan bajo o sobre la superficie del territorio nacional o en la plataforma submarina de sus aguas jurisdiccionales y cuya conservación interesa a la historia, al arte o a la ciencia; los santuarios de la naturaleza; los monumentos, estatuas, columnas, pirámides, fuentes, placas, coronas, inscripciones y, en general, los objetos que estén destinados a permanecer en un sitio público, con carácter conmemorativo. Su tuición y protección se ejercerá por medio del Consejo de Monumentos Nacionales, en la forma que determina la presente ley.
                        - generic [ref=e256]:
                          - text:  
                          - generic [ref=e259]: TITULO II
                        - generic [ref=e260]:
                          - text:  
                          - generic [ref=e262]:
                            - generic [ref=e263]:
                              - text: ARTICULO 2° El Consejo de Monumentos Nacionales es un organismo técnico que depende directamente del
                              - link "Ley 21045 Art. 42 N° 1 a), b), c) D.O. 03.11.2017" [ref=e265] [cursor=pointer]:
                                - /url: navegar?idNorma=1110097&idParte=9845578&idVersion=2017-11-03
                                - text: Ley 21045
                                - text: Art. 42 N° 1 a), b), c)
                                - text: D.O. 03.11.2017
                              - text: "Ministerio de las Culturas, las Artes y el Patrimonio y que se compone de los siguientes miembros:"
                            - generic [ref=e266]: a) Del Subsecretario del Patrimonio Cultural, quien lo presidirá;
                            - generic [ref=e267]: b) Del Director del Servicio Nacional del Patrimonio Cultural, quien será su Vicepresidente Ejecutivo y subrogará al Subsecretario cuando éste se encuentre impedido de asistir por cualquier causa;
                            - generic [ref=e268]: c) Del Conservador del Museo Histórico Nacional;
                            - generic [ref=e269]: d) Del Conservador del Museo Nacional de Historia Natural;
                            - generic [ref=e270]: e) Del Conservador del Museo Nacional de Bellas Artes;
                            - generic [ref=e271]: "f) Del Conservador del Archivo Nacional:"
                            - generic [ref=e272]: g) Del Director de Arquitectura de la Dirección General de Obras Públicas;
                            - generic [ref=e273]: h) De un representante del Ministerio de la Vivienda y Urbanismo;
                            - generic [ref=e274]: i) De un representante de la Sociedad Chilena de Historia y Geografía;
                            - generic [ref=e275]: j) De un representante del Colegio de Arquitectos;
                            - generic [ref=e276]: k) De un representante del Ministerio del Interior, que podrá ser un oficial superior de Carabineros;
                            - generic [ref=e277]: l) De un representante del Ministerio de Defensa Nacional, que deberá ser un oficial superior de las Fuerzas Armadas;
                            - generic [ref=e278]: m) De un abogado del Consejo de Defensa del Estado, que será su asesor jurídico;
                            - generic [ref=e279]: n) De un representante de la Sociedad de Escritores de Chile;
                            - generic [ref=e280]: o) De un experto en conservación y restauración de monumentos;
                            - generic [ref=e281]: p) De un escultor que represente a la Sociedad Nacional de Bellas Artes y a la Asociación de Pintores y Escultores de Chile;
                            - generic [ref=e282]: q) De un representante del Instituto de Conmemoración Histórica de Chile;
                            - generic [ref=e283]: r) De un representante de la Sociedad Chilena de Arqueología;
                            - generic [ref=e284]: s) De un miembro del Instituto de Historia de la Arquitectura de la Facultad de Arquitectura y Urbanismo de la Universidad de Chile.
                            - generic [ref=e285]:
                              - text: El Presidente de la República designará, cada tres años, a los miembros del Consejo que no lo sean por derecho propio, a propuesta de las respectivas instituciones, a excepción del cargo de la letra o), que será propuesto por el
                              - link "Ley 21045 Art. 42 N° 1 d), e) D.O. 03.11.2017" [ref=e287] [cursor=pointer]:
                                - /url: navegar?idNorma=1110097&idParte=9845578&idVersion=2017-11-03
                                - text: Ley 21045
                                - text: Art. 42 N° 1 d), e)
                                - text: D.O. 03.11.2017
                              - text: Ministerio de las Culturas, las Artes y el Patrimonio, y del de la letra p), que será designado a propuesta en terna de las dos entidades que allí se mencionan.
                            - generic [ref=e288]:
                              - text: t) De
                              - link "Ley 21045 Art. 42 N° 1 f), g) D.O. 03.11.2017" [ref=e290] [cursor=pointer]:
                                - /url: navegar?idNorma=1110097&idParte=9845578&idVersion=2017-11-03
                                - text: Ley 21045
