                        - generic [ref=e314]:
                          - text:  
                          - generic [ref=e316]:
                            - generic [ref=e317]: Artículo 5.°- El Consejo de Monumentos Nacionales podrá sesionar en primera citación con ocho de sus miembros y en segunda con un mínimo de cinco, y sus acuerdos se adoptarán por simple mayoría de votos.
                            - generic [ref=e318]:
                              - text: La
                              - link "Ley 21677 Art. primero N° 2 D.O. 17.06.2024" [ref=e320] [cursor=pointer]:
                                - /url: navegar?idNorma=1204223&idParte=10503764&idVersion=2024-06-17
                                - text: Ley 21677
                                - text: Art. primero N° 2
                                - text: D.O. 17.06.2024
                              - text: s sesiones plenarias del Consejo deberán ser grabadas y transmitidas en directo por el medio más idóneo y, además, publicadas íntegramente en un plazo máximo de tres días hábiles desde su celebración, en la plataforma que se disponga para dicho efecto en el sitio oficial del Consejo de Monumentos Nacionales. El Consejo deberá sesionar, al menos, dos veces al mes.
                            - generic [ref=e321]: Con todo, podrá declararse la reserva o el secreto de la sesión, cuando las temáticas a tratar correspondan a alguna de las causales establecidas en el artículo 21 del artículo primero de la ley N° 20.285, sobre acceso a la información pública, lo que deberá ser acordado de manera fundada por los dos tercios de los miembros presentes en la sesión.
