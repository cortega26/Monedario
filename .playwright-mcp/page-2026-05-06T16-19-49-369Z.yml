                                - text: D.O. 03.11.2017
                              - text: un representante de asociaciones de barrios y zonas patrimoniales, nombrado de conformidad al reglamento;
                            - generic [ref=e291]: u) De un representante del Colegio de Arqueólogos de Chile;
                            - generic [ref=e292]:
                              - text: v) Un
                              - link "Ley 20423 Art. 53 D.O. 12.02.2010" [ref=e294] [cursor=pointer]:
                                - /url: navegar?idNorma=1010960&idParte=8870356&idVersion=2010-02-12
