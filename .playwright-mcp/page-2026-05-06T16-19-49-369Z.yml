                              - text: representante del Servicio Nacional de Turismo, y
                            - generic [ref=e295]:
                              - text: w) De un
                              - link "Ley 21215 Art. único N° 1 a., b. y c. D.O. 20.02.2020" [ref=e297] [cursor=pointer]:
                                - /url: navegar?idNorma=1142580&idParte=10102076&idVersion=2020-02-20
                                - text: Ley 21215
                                - text: Art. único N° 1
                                - text: a., b. y c.
                                - text: D.O. 20.02.2020
                              - text: Paleontólogo designado por la Sociedad Paleontológica de Chile.
                            - generic [ref=e298]:
                              - text: Los
                              - link "Ley 21045 Art. 42 N° 1 h) D.O. 03.11.2017" [ref=e300] [cursor=pointer]:
                                - /url: navegar?idNorma=1110097&idParte=9845578&idVersion=2017-11-03
                                - text: Ley 21045
                                - text: Art. 42 N° 1 h)
                                - text: D.O. 03.11.2017
                              - text: consejeros que no sean funcionarios públicos tendrán derecho a percibir una dieta mensual equivalente a ocho unidades de fomento, siempre que asistan a lo menos a una sesión mensual, considerando tanto las sesiones ordinarias como las extraordinarias. Esta dieta será compatible con otros ingresos que perciba el consejero.
