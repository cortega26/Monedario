      - heading "Aporte voluntario" [level=2] [ref=e52]
      - paragraph [ref=e53]: Puedes hacer un aporte puntual a través de Ko-fi, una plataforma de pagos para proyectos independientes. El proceso es seguro y no requiere registro. Puedes pagar con tarjeta de crédito o débito, PayPal, Apple Pay o Google Pay.
      - paragraph [ref=e54]: El aporte mínimo es de 3 USD. Si eliges PayPal, es posible que el navegador te redirija brevemente a PayPal para completar el pago.
