      - heading "Ayuda a mantener Monedario gratuito" [level=1] [ref=e43]
      - paragraph [ref=e44]:
        - text: Monedario.cl publica guías y calculadoras financieras para personas en Chile. El sitio no cobra por leer sus contenidos ni por usar sus herramientas.
        - text: "Mantenerlo toma muchas horas cada semana: revisar fuentes oficiales, actualizar cambios normativos, corregir errores, mejorar calculadoras y cuidar que la información sea clara, responsable y útil."
        - text: Si Monedario te ha servido, puedes apoyar el proyecto con una pequeña donación voluntaria. También ayuda mucho compartir la página con alguien a quien le pueda servir.
    - generic [ref=e45]:
      - heading "Comparte Monedario" [level=2] [ref=e46]
      - paragraph [ref=e47]: "La forma más directa de apoyar este proyecto es pasarle el enlace a alguien que lo necesite: una guía, una calculadora o el sitio completo. Es gratis, tarda segundos y es lo que más ayuda a que llegue a más personas."
