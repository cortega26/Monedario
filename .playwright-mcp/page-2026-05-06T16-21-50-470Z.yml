                            - generic [ref=e997]: A) Los siguientes inmuebles mientras se cumplan la o las condiciones y el plazo que en cada caso se indica y la condición establecida en la letra B de esta Sección, cuando procediere.
                            - generic [ref=e998]: 1) Los inmuebles destinados al giro de los negocios de las industrias que existan o que se instalen en el departamento de Arica; hasta el 1° de Enero de 1974 que sean de propiedad de las respectivas industrias; (I-90)
