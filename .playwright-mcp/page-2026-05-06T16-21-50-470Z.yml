                              - text: Artículo 29°.- Los avalúos de los bienes raíces
                              - generic [ref=e675]: Art.3°, 10.
                              - text: agrícolas serán modificados por el Servicio de Impuestos Internos, por las siguientes causales, además de las señaladas en el artículo anterior.
                            - generic [ref=e676]: a) Construcción de nuevas casas patronales, cuyo valor exceda de doce y medio sueldos vitales anuales de la industria y del comercio del departamento de Santiago;
                            - generic [ref=e677]: b) Alteración de la capacidad potencial de uso actual del suelo agrícola, por hecho sobrevinientes, de cualquiera naturaleza y de carácter permanente a menos de que se trate de obras que beneficien de un modo general a una región, las cuales deberán considerarse en una tasación general, o que se trate de las mejoras costeadas por los particulares que señala el inciso 8° del artículo 1°;
                            - generic [ref=e678]: En el caso de los bienes contemplados en el inciso sexto del artículo primero, serán causales de modificación de los avalúos las señaladas en los artículos 28° y 30°.
                        - generic [ref=e679]:
