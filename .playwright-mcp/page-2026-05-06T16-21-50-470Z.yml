                              - text: Artículo 28°.- Los avalúos o contribuciones de los
                              - generic [ref=e660]: Art.3°, 10.
                              - text: "bienes raíces agrícolas, no agrícolas, serán modificados y 11. a) por el Servicio de Impuestos Internos, por las siguientes causales:"
                            - generic [ref=e661]: a) Errores de transcripción y copia, entendiéndose por tal los producidos al pasar los avalúos, de los registros o de los fallos de los reclamos de avalúos a los roles de avalúos o contribuciones;
                            - generic [ref=e662]:
                              - text: b) Errores de cálculo entendiéndose por tales los que pudieren cometerse en las operaciones aritméticas practicadas para determinar tanto la superficie del inmueble, como su avalúo, o su reajuste;
                              - generic [ref=e663]:
                                - text: LEY 19388
                                - text: Art.3°, 11.
                            - generic [ref=e664]: "c) Errores de clasificación, como por ejemplo los siguientes: atribuir la calidad de regados a terrenos de b) rulos, o de planos a los de lomaje, de concreto a las construcciones de otro material, etc.;"
                            - generic [ref=e665]:
                              - text: d) Cambio de destinación del predio que importe un cambio de la serie en que hubiere sido incluido de acuerdo al artículo 1°, o un cambio de destino o uso
                              - generic [ref=e666]:
                                - text: LEY 19388
                                - text: Art.3°, 11.
                                - text: c)
                              - text: dentro de la misma serie, que implique alteraciòn en el avalúo o en las contribuciones;
                            - generic [ref=e667]:
                              - text: e) Siniestros u otros factores que disminuyan considerablemente el valor de una propiedad, por causas no imputables al propietario u ocupante;
                              - generic [ref=e668]:
                                - text: LEY 19388
                                - text: Art.3°, 11.
                                - text: d), e) y f)
                            - generic [ref=e669]: f) Omisión de bienes en la tasación del predio de que forman parte, y
                            - generic [ref=e670]: g) Error u omisión en el otorgamiento de exenciones.
