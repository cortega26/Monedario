                          - generic [ref=e755]:
                            - text: Artículo 38°.- Sobre la base de los avalúos
                            - generic [ref=e756]:
                              - text: LEY 19388
                              - text: Art.3°, 18.
                              - text: a), b) y c)
                            - text: vigentes para cada semestre consideradas las modificaciones a que se refieren los artículos 38° y siguientes y las exenciones del Cuadro Anexo N° 1, el Servicio de Impuestos Internos emitirá, por comunas, un rol, de cobro del impuesto a los bienes raíces, que se denominará "Rol Semestral de Contribuciones", y que contendrá, además de los datos indispensables para la identificación del predio, su avalúo, la exención si tuviere, y el impuesto.
                        - generic [ref=e757]:
                          - text:  
                          - generic [ref=e759]:
                            - generic [ref=e760]: Artículo 39°.- El Servicio de Impuestos Internos hará efectivas las variaciones que se determinen respecto de los impuestos girados en los roles anuales de contribuciones a que se refiere el artículo anterior, mediante roles suplementarios de contribuciones que confeccionará, por comunas, el Departamento de Máquinas del referido Servicio.
                            - generic [ref=e761]: Los roles suplementarios contendrán las diferencias de contribuciones provenientes de modificaciones que importen una mayor contribución a la que figura en los roles anuales; los roles de reemplazo contendrán todas aquellas modificaciones que signifiquen rebaja de la contribución anotada en los roles anuales, incluyéndose en este caso, el total del nuevo monto por cobrar.
                            - generic [ref=e762]:
                              - text: Las contribuciones que deban pagarse
                              - generic [ref=e763]: DL 935 1975
                              - text: retroactivamente con respecto al año en que se pongan en ART 7 N° 1 cobranza los roles suplementarios y de reemplazos, se girarán sobre la base del avalúo del año en que se pongan en cobro dichos roles. La retroactividad no podrá ser superior a tres años.
                            - generic [ref=e764]:
                              - text: En los casos en que, con ocasión de nuevas
                              - generic [ref=e765]:
                                - text: DL 935 1975
                                - text: ART 7 N° 1
                              - text: construcciones, ampliaciones o instalaciones, deba procederse al cobro retroactivo de contribuciones y el predio en que ellas se hayan efectuado hubiere sido objeto de enajenación, aquél se hará efectivo a contar del 1° de enero del año siguiente al de la correspondiente inscripción de dominio en el Registro de Propiedad del Conservador de Bienes Raíces.
                        - generic [ref=e766]:
                          - text:  
