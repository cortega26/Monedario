                            - generic [ref=e746]: Art.3°, 10.
                            - text: perjudicados por las modificaciones individuales de los avalúos de sus predios, efectuadas en conformidad al Párrafo 2° del presente Título podrán reclamar de ellas con arreglo a las normas establecidas en el Título III del Libro Tercero del Código Tributario.
