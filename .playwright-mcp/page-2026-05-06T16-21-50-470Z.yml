                              - text: Artículo 33°.- Tratándose de nuevas obras, se
                              - generic [ref=e711]: Art.3°, 10.
                              - text: entenderá que el hecho que causa la modificación de avalúo, se produce cuando ellas se encuentren terminadas.
                            - generic [ref=e712]: Se podrán avaluar parcialmente los pisos de un edificio de departamentos, aunque no se haya dado fin a la construcción total de dicho edificio.
                            - generic [ref=e713]: Se entenderán terminadas las obras cuando se encuentren en condiciones de ser usadas.
