                              - text: Artículo 30°.- Los avalúos de los bienes raíces
                              - generic [ref=e683]: Art.3°,10.
                              - text: "no agrícolas serán modificados por el Servicio de Impuestos Internos por las siguientes causales, además de las señaladas en el artículo 28°:"
                            - generic [ref=e684]: a) Nuevas construcciones e instalaciones;
                            - generic [ref=e685]:
