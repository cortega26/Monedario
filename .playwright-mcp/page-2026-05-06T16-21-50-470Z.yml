                        - generic [ref=e1332]:
                          - text:  
                          - generic [ref=e1334]:
                            - generic [ref=e1335]: C U A D R O A N E X O N° 2.
                            - generic [ref=e1336]: NOMINA DE EXENCIONES AL ARTICULO 48° DE LA LEY DE
                            - generic [ref=e1337]: IMPUESTO TERRITORIAL
                            - generic [ref=e1338]: I- LIBERACION TOTAL
                            - generic [ref=e1339]: 1) A los arrendatarios u ocupantes, a cualquier título, de inmuebles fiscales destinados a fines habitacionales; (II-1)
                            - generic [ref=e1340]: 2) A los funcionarios públicos y municipales que por razones inherentes a su cargo estén obligados a residir en propiedades fiscales o municipales; (II-2)
                            - generic [ref=e1341]: 3) A los ocupantes a cualquier título de inmuebles ubicados en el departamento de Isla de Pascua; (II-3)
                            - generic [ref=e1342]: 4) A los concesionarios de playas o terrenos contiguos hasta una distancia de 80 metros, ubicados en la provincia de Chiloé; siempre que tengan un avalúo inferior a diez sueldos vitales del departamento de Santiago y sean titulares de una sola concesión; (II-4)
                            - generic [ref=e1343]: 5) A las personas radicadas en predios fiscales, de acuerdo con las disposiciones del DFL. N° 65, de 14 de Enero de 1960, durante el período de radicación; (II-5)
                            - generic [ref=e1344]: 6) A los concesionarios de islas o partes del Territorio Antártico Chileno; (II-6)
                            - generic [ref=e1345]: 7) Al concesionario o arrendatario de la propiedad de la Municipalidad de Los Angeles, inscrito a fojas 251, N° 385, del Registro de Propiedad de 1954 del Conservador de Bienes Raíces de Los Angeles, destinado al funcionamiento del Hotel Alcázar; (II-7)
                            - generic [ref=e1346]: "8) Al concesionario o arrendatario de la propiedad de la Municipalidad de Puerto Octay, ubicado en la península denominada \"Centinela\", cuyos deslindes son: Norte, Sur y Este, riberas del Lago Llanquihue, y Oeste, terrenos de la misma Municipalidad, y destinado a establecimiento hotelero; (II-8)"
                            - generic [ref=e1347]: 9) Al concesionario, arrendatario u ocupante de la propiedad de la Municipalidad de Rengo, destinada a establecimiento hotelero, locales comerciales y departamentos de renta y que deslinda como sigue; al Norte, con propiedad de Sucesión Francisco Matus Turra; al Sur, con la Plaza de Armas; al Oriente, propiedad de la Municipalidad de Rengo, y al Poniente, propiedad de la Municipalidad de Rengo; (II-9)
                            - generic [ref=e1348]: "10) Al concesionario o arrendatario del Teatro Municipal de Peumo que tiene los siguientes deslindes: al Norte, calles Carmen y Balmaceda; Sur, Municipalidad y Escuela Vocacional; Oriente, Escuela Vocacional y calle Carmen, y Poniente, edificio municipal y calle Balmaceda, respecto del edificio del mismo teatro; (II-10)"
                            - generic [ref=e1349]: "11) Los concesionarios u ocupantes a cualquier título del inmueble afecto a las disposiciones de la ley N° 12.437, de 21 de Febrero de 1957, ubicado en la comuna de Las Condes, cuyos deslindes son los siguientes: al Norte, en 450 metros aproximadamente, con propiedad de los señores Manuel y Narciso Goycolea Espoz; al Oriente, en 661 metros, con camino vecinal de por medio con el fundo \"Lo Castillo\", en 27 metros, con prolongación de la calle O`Brien; en 990 metros, con fondos de predios de diversos propietarios que tienen sus frentes a la Avenida Nueva Costanera, Avenida Nueva Costanera y terrenos de la Conferencia de San Vicente de Paul, de la Parroquia de San Ramón, y en 195 metros, con la Avenida Vitacura; al Sur, en 306 metros aproximadamente, con propiedad de los señores Manuel y Narciso Goycolea y la Empresa de Agua Potable de Santiago; al Poniente, con el lecho del río Mapocho, en 2.000 metros aproximadamente, en línea que sigue el curso del río; (II-11)"
                            - generic [ref=e1350]: II- LIBERACION DEL PAGO DE LA PARTE FISCAL DEL
                            - generic [ref=e1351]: IMPUESTO TERRITORIAL
                            - generic [ref=e1352]: 1) La Agrupación Nacional de Empleados Fiscales "ANEF" respecto de la propiedad fiscal destinada a su sede social por la ley N° 15.575; (II-12)
                            - generic [ref=e1353]: 2) Las oficinas salitreras paralizadas respecto de las concesiones fiscales y obras portuarias que no estuvieren en uso; (II-13)
                            - generic [ref=e1354]: 3) La Sociedad Nacional de Minería, respecto del inmueble fiscal ubicado en Santiago, calle Moneda N° 759; (II-14)
                            - generic [ref=e1355]: II- 1) Inciso agregado al Art. 51° de la ley N° 4.174. por el Art. 2°, ley N° 16.438, de 26-2-66
                            - generic [ref=e1356]: II- 2) Inciso agregado al Art. 51° de la ley N° 4.174, por el Art. 129°, de la ley N° 16.250, de 21-4-65
                            - generic [ref=e1357]: II- 3) Art. 41° de la ley N° 16.441, de 1°-3-66
                            - generic [ref=e1358]: II- 4) Inciso agregado al Art. 51° de la ley N° 4.174, por el Art. único de la ley N° 14.674, de 26-10-61
                            - generic [ref=e1359]: II- 5) Inc. 5° del Art. 16° del DFL. 65, de 14-1-60 (D.O. 22-2-60)
                            - generic [ref=e1360]: II- 6) Inc. 1° del Art. 11° del Dto. del Ministerio de Relaciones Exteriores N° 298, de 17-7-56 (D.O. 3-10-56)
                            - generic [ref=e1361]: II- 7) Art. 5° de la ley N° 16.524, de 13-8-66
                            - generic [ref=e1362]: II- 8) Art. único de la ley N° 16.079, de 19-1-65
                            - generic [ref=e1363]: II- 9) Art. único de la ley N° 15.223, de 3-8-63
