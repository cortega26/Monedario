                              - generic [ref=e686]:
                                - text: LEY 19388
                                - text: Art.3°, 12.
                                - text: a)
                              - text: transformaciones, siempre que no correspondan a obras de conservación, como el reemplazo de los revestimientos exteriores o interiores, cielos, pinturas o pavimentos por otros similares a los reemplazados;
                            - generic [ref=e687]: c) Demolición total o parcial de construcciones;
                            - generic [ref=e688]:
                              - text: d) Nuevas obras de urbanización que aumenten el
                              - generic [ref=e689]:
                                - text: LEY 19388
                                - text: Art.3°, 12.
                                - text: b) y c)
                              - text: valor de los bienes tasados, y
                            - generic [ref=e690]: e) Divisiones o fusiones de predios, siempre que signifiquen un cambio en el valor del bien raíz.
                        - generic [ref=e691]:
                          - text:  
                          - generic [ref=e693]:
                            - generic [ref=e694]:
                              - text: Artículo 31°.- Las modificaciones de avalúos
                              - generic [ref=e695]: Art.3°, 10.
                              - text: o de contribuciones regirán desde el 1° de Enero del año siguiente a aquél en que ocurra el hecho que
                              - generic [ref=e696]:
                                - text: LEY 19388
                                - text: Art.3°, 13.
                              - text: determine la modificación, o en caso de no poderse precisar la fecha de ocurrencia del hecho, desde el 1° de Enero del año siguiente a aquel en que el Servicio constate la causal respectiva.
                            - generic [ref=e697]: Las modificaciones de avalúos a que se refieren las letras a), b), c) y f), del artículo 28°, regirán desde la misma fecha en que estuvo vigente el avalúo que contenía el error o la omisión.
                            - generic [ref=e698]:
                              - text: No obstante lo dispuesto en el inciso primero de
                              - generic [ref=e699]:
                                - text: LEY 17564
                                - text: ART 34
                              - text: este artículo, las modificaciones a que se refieren las letras e) del artículo 28° y c) del artículo 30°, regirán desde el 1° de Enero del año en que ocurra la causal siempre que se soliciten dentro de ese mismo año.
                            - generic [ref=e700]: En virtud de estas rebajas no procederá la devolución de impuestos.
                            - generic [ref=e701]: Lo anterior sin perjuicio de la prescripción que establece el artículo 2521° del Código Civil y Art. 200°, del Código Tributario.
