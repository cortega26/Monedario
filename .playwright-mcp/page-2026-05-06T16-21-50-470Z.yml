                              - text: Art.3° 19.
                              - text: LEY 19506
                              - text: Art. 15
                              - text: D.O. 30.07.1997
                            - text: remitirá a cada municipalidad y a la Tesorería General de la República los roles semestrales, suplementarios y de reemplazos y un cuadro resumen por comuna que contendrá, distribuidos por clasificaciones, el avalúo total, las exenciones y el impuesto.
                        - generic [ref=e780]:
                          - text:  
                          - generic [ref=e782]:
                            - generic [ref=e783]:
                              - text: Artículo 43°.- El impuesto territorial anual
                              - generic [ref=e784]:
                                - text: DL 54 1973
                                - text: ART 5 N° 2
                              - text: será pagado semestralmente en el curso de los meses de Abril y Noviembre de cada año, a menos que el Presidente NOTA 8 de la República fije otras fechas con arreglo a la
                              - generic [ref=e785]:
                                - text: LEY 19388
                                - text: Art.3°, 20.
                              - text: facultad que le confiere el artículo 36° del Código Tributario. Sin embargo, el contribuyente podrá pagar durante el mes de Abril, los impuestos correspondientes a todo el año.
                            - generic [ref=e786]:
                              - 'link "NOTA: 8" [ref=e787] [cursor=pointer]':
                                - /url: "#rnp67"
                              - text: La modificación introducida por el N° 2 del art. 5° del D.L. 54, de 1973, comenzará a regir del 1° de julio de 1973.- (D.L. 54, 1973, artículo 6°)
                        - generic [ref=e788]:
                          - text:  
                          - generic [ref=e790]:
                            - generic [ref=e791]:
                              - text: Artículo 44°.- Los impuestos incluidos en los roles
                              - generic [ref=e792]:
                                - text: LEY 19388
                                - text: Art.3°, 21.
                              - text: suplementarios y de reemplazo a que se refiere el artículo 39°, serán pagados en los meses de junio y diciembre de cada año e incorporarán las modificaciones establecidas en resoluciones notificadas hasta el 30 de abril y 31 de octubre, respectivamente, del semestre en que deban pagarse los impuestos.
                            - generic [ref=e793]: No obstante lo señalado en el inciso anterior, el Director Nacional del Servicio de Impuestos Internos estará facultado para dividir el pago de los impuestos indicados en parcialidades por pagarse conjuntamente con las contribuciones futuras, en un plazo máximo de dos años.
                            - generic [ref=e794]: Asimismo, la inscripción de nuevas propiedades en los roles de avalúos y contribuciones correspondientes deberá efectuarse, a más tardar, en el año siguiente de recibido, por parte del Servicio de Impuestos Internos, el certificado de recepción final emitido por la municipalidad respectiva.
                        - generic [ref=e795]:
                          - text:  
                          - generic [ref=e797]:
                            - generic [ref=e798]: Artículo 45°.- En la provincia de Aysén el pago se hará por semestres en los meses de Marzo y Noviembre de cada año.
                            - generic [ref=e799]: Sin embargo, no se cobrará intereses penales ni multas con relación a los impuestos del primer semestre, a los contribuyentes morosos que paguen la anualidad completa.
                        - generic [ref=e800]:
                          - text:  
                          - generic [ref=e802]:
                            - generic [ref=e803]: TITULO VI
                            - generic [ref=e804]: DE LOS OBLIGADOS AL PAGO DEL IMPUESTO
                        - generic [ref=e805]:
                          - text:  
                          - generic [ref=e807]:
                            - generic [ref=e808]: Artículo 46°.- El impuesto a los bienes raíces será pagado por el dueño o por el ocupante de la propiedad, ya sea éste usufructuario, arrendatario o mero tenedor, sin perjuicio de la responsabilidad que afecte al propietario. No obstante, los usufructuarios, arrendatarios y, en general, los que ocupen una propiedad en virtud de un acto o contrato que no importe transferencia de dominio, no estarán obligados a pagar el impuesto devengado con anterioridad al acto o contrato.
                            - generic [ref=e809]: Efectuado el pago por el arrendatario, éste quedará autorizado para deducir la suma respectiva, de los cánones de arrendamiento.
                        - generic [ref=e810]:
                          - text:  
                          - generic [ref=e812]:
                            - generic [ref=e813]: Artículo 47°.- Cuando una propiedad raíz pertenezca a dos o más dueños en común, cada uno de ellos responderá solidariamente del pago de los impuestos, sin perjuicio de que éstos sean divididos entre los propietarios, a prorrata de sus derechos en la comunidad.
                            - generic [ref=e814]: Si un bien raíz pertenece a una sociedad o persona jurídica, los administradores, gerentes o directores, serán responsables solidariamente, del pago del impuesto sin perjuicio de sus derechos contra el deudor principal.
                        - generic [ref=e815]:
                          - text:  
                          - generic [ref=e817]:
                            - generic [ref=e818]: Artículo 48°.- El concesionario u ocupante por cualquier título, de bienes raíces fiscales, municipales o nacionales de uso público, pagará los impuestos correspondientes al bien raíz ocupado.
                            - generic [ref=e819]: Todo arrendatario de un bien raíz fiscal queda obligado a pagar las contribuciones territoriales durante todo el plazo del arrendamiento y mientras esté ocupando materialmente el predio. Conjuntamente con el pago de las rentas deberá comprobarse el cumplimiento oportuno de esta obligación tributaria.
                            - generic [ref=e820]: Lo dispuesto en el presente artículo no se aplicará con respecto de los predios que se señalan en el Cuadro Anexo N° 2 de la presente ley.
                        - generic [ref=e821]:
