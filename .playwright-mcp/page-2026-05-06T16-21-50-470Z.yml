                              - text: El artículo 1° del D.F.L. N° 11, de Hacienda, publicado en el "Diario Oficial" de 30 de junio de 1990, rebajó, a contar del 1° de julio de 1990, al once por mil anual la tasa establecida en el presente artículo, sobre Impuesto Territorial, que corresponde aplicar sobre los avalúos de los bienes raíces no agrícolas.
                            - generic [ref=e558]:
                              - 'link "NOTA: 4" [ref=e559] [cursor=pointer]':
                                - /url: "#rnp26"
                              - text: El artículo 2° de la Ley N° 19.000, publicada en el "Diario Oficial" de 26 de septiembre de 1990, ordenó restablecer, a contar del 1° de julio de 1990, los avalúos determinados para los efectos del impuesto territorial contenido en la presente Ley, vigentes al 30 de junio de 1990, y la tasa de veinte por mil al año establecida en el artículo 15 de este cuerpo legal, vigente a esa fecha. Desde igual fecha se entenderá que rige el monto exento a que se refiere el artículo 5° del Decreto Ley N° 1.754, de 1977, vigente al 30 de junio de 1990.
                              - text: Será aplicable a los avalúos y monto exento señalados en el inciso anterior, desde el 1° de julio de 1990, el reajuste que dispone el artículo 1° del decreto ley N° 2.325, de 1978.
                              - text: El mismo artículo ordena restablecer, desde el 1° de Julio de 1990, la tasa adicional establecida por el artículo 3° de la Ley N° 18.206.
