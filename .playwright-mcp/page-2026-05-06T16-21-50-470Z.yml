                            - generic [ref=e253]: "Santiago, 10 de Noviembre de 1969.- Hoy se decretó lo que sigue:"
                            - generic [ref=e254]: "Núm. 2.356.- Vistos: Que el artículo 9° de la ley N° 16.623, de 25 de Abril de 1967, me facultó para fijar el texto de la ley sobre contribuciones de Bienes Raíces, refundiendo en un solo cuerpo legal la ley N° 4.174, sus modificaciones posteriores y las demás disposiciones complementarias o relacionadas con esta materia contenidas en otros textos legales, decretos o reglamentos;"
                            - generic [ref=e255]: Que para el efecto, el citado artículo 9° de la ley N° 16.623 me faculta para sistematizar y coordinar la titulación y el articulado de la nueva ley, sustituir y modificar palabras, frases o referencias que no concuerden con la legislación vigente; eliminar las disposiciones que hayan perdido actualidad y agregar las necesarias para la acertada inteligencia y coordinación de la ley,
