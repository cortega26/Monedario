                          - generic [ref=e774]: Artículo 41°.- Las exenciones de contribuciones tendrán efecto desde el 1° de Enero siguiente a la fecha en que las propiedades cumplan las condiciones de la franquicia. Si el interesado no hubiere pedido en su oportunidad la exención, en ningún caso podrá ésta otorgarse con anterioridad al rol vigente.
                        - generic [ref=e775]:
                          - text:  
                          - generic [ref=e778]:
                            - text: Artículo 42°.- El Servicio de Impuestos Internos
