                                - text: Art.3°, 16.
                                - text: a) y b)
                              - text: "Internos, utilizando, entre otras fuentes:"
                            - generic [ref=e729]: 1) La información que emane de las escrituras públicas de transferencia y de las inscripciones que se practiquen en los registros de los conservadores bienes raíces. Para estos efectos, las notarías y los conservadores de bienes raíces deberán proporcionar al Servicio de Impuestos Internos la información que se les solicite en la forma y plazo que este Servicio determine, y
                            - generic [ref=e730]: 2) La información que deberán remitirle las respectivas municipalidades, relativa a permisos y recepciones de construcciones, loteos y subdivisiones, patentes municipales, concesiones de bienes municipales o nacionales de uso público entregados a terceros y aprobaciones de propiedades acogidas a la Ley de Propiedad Horizontal, en la forma y plazo que este Servicio determine.
                        - generic [ref=e731]:
                          - text:  
                          - generic [ref=e733]:
                            - generic [ref=e734]:
                              - text: Artículo 36°.- Si el propietario de un inmueble
                              - generic [ref=e735]: Art.3°, 10.
                              - text: suj
                              - 'link "NOTA: 7" [ref=e737] [cursor=pointer]':
