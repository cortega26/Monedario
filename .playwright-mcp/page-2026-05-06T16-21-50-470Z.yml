                                - /url: "#rnp70"
                              - text: La derogación al artículo 49 de la presente ley regirá a contar del día 1° del mes siguiente al de la fecha de publicación del D.L. 3474. (D.L. 3474, Art. 3°, publicado en el Diario Oficial el 5 de septiembre de 1980).
                        - generic [ref=e836]:
