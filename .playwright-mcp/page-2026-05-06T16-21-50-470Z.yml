                              - text: eto a expropiación conforme el procedimiento de la ley N° 5.604, y sus modificaciones, reclamare de la
                              - 'link "NOTA: 7" [ref=e739] [cursor=pointer]':
                                - /url: "#np58"
                              - text: tasación en la forma prevista en el artículo 27°, del decreto N° 103, de 21 de Febrero de 1968, del Ministerio de la Vivienda y Urbanismo, y la entidad expropiante se desistiere de la expropiación dentro del plazo de treinta días, contado desde la reclamación, el Servicio de Impuestos Internos deberá modificar el avalúo del predio, para todos los efectos tributarios, elevándolo hasta el valor asignado en la tasación reclamada. El tribunal, de oficio, comunicará a ese Servicio el desistimiento de la expropiación y el valor señalado en la tasación.
                            - generic [ref=e740]:
                              - 'link "NOTA: 7" [ref=e741] [cursor=pointer]':
                                - /url: "#rnp58"
                              - text: Este artículo debe entenderse derogado por el Decreto Ley N° 2.186, publicado en el "Diario Oficial" de 9 de Junio de 1978, Ley Orgánica de Expropiaciones, que, en su artículo 41 dispuso que desde su vigencia quedaban derogadas todas las leyes preexistentes sobre expropiaciones, aún en la parte que no sean contrarias al mismo decreto ley.
