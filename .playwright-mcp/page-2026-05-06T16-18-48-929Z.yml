                              - generic [ref=e271]:
                                - text: LEY 19388
                                - text: Art.2°, 2.
                              - text: serán percibidos por la unidad encargada de la administración y finanzas de cada municipalidad, según lo dispuesto en la ley Orgánica Constitucional de Municipalidades.
                            - generic [ref=e272]:
                              - text: No obstante, las Municipalidades podrán celebrar
                              - generic [ref=e273]:
                                - text: LEY 18681,
