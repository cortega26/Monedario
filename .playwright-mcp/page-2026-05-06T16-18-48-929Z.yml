                                - /url: "#rnp1"
                              - text: El Artículo 1° Transitorio de la Ley N° 19.388, publicada en el "Diario Oficial" de 30 de Mayo de 1995, dispuso su vigencia un mes después de su publicación. No obstante, hasta la entrada en vigencia de la primera tasación de los bienes raíces, agrícolas y no agrícolas, que se efectúe con posterioridad a la promulgación de esta ley, no se aplicará lo dispuesto en el número 3 del artículo 3°.
