                              - text: convenios con el Banco del Estado de Chile y con los bancos comerciales, para que éstos reciban dentro de de los plazos legales el pago de los ingresos o rentas municipales y los recargos de beneficio fiscal que puedan existir sobre ellos.
                            - generic [ref=e274]: Los pagos deberán comprender la totalidad de las cantidades incluidas en los respectivos boletines, giros u órdenes. Si el ingreso o renta debe legalmente enterarse por cuotas, el pago abarcará la totalidad de la cuota correspondiente.
                            - generic [ref=e275]: El pago así efectuado, extinguirá la obligación pertinente hasta el monto de la cantidad enterada, pero el recibo de ésta no acreditará, por si solo, que se está al día en el cumplimiento de la obligación respectiva.
