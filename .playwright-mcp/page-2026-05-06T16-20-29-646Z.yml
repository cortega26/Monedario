                          - generic [ref=e401]:
                            - generic [ref=e402]: "Artículo 4°.- El Servicio de Impuestos Internos impartirá las instrucciones técnicas y administrativas necesarias para efectuar la tasación, ajustándose a las normas siguientes:"
                            - generic [ref=e403]: "1°.- Para la tasación de los predios agrícolas el Servicio de Impuestos Internos confeccionará:"
                            - generic [ref=e404]: a) Tablas de clasificación de los terrenos, según su capacidad potencial de uso actual;
                            - generic [ref=e405]: b) Mapas y tablas de ubicación, relativas a la clase de vías de comunicaciones y distancia de los centros de abastecimientos, servicios y mercados, y
                            - generic [ref=e406]: c) Tabla de valores para los distintos tipos de terrenos de conformidad a las tablas y mapas señalados.
                            - generic [ref=e407]:
                              - text: 2°.- Para la tasación de los bienes raíces de la segunda serie, se confeccionarán tablas de clasificación de las construcciones y de los terrenos y se fijarán los valores unitarios que correspondan a cada tipo de bien. La clasificación de las
                              - generic [ref=e408]:
