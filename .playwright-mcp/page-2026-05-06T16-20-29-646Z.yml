                              - text: e y medio sueldos vitales anuales de la industria y el comercio del departamento de Santiago. No obstante, en el caso de los inmuebles a que se refiere el inciso anterior el impuesto se aplicará, además, sobre el avalúo de todos los bienes.
                            - generic [ref=e346]: "Las tasaciones que pudieren ordenarse no incluirán el mayor valor que adquieran los terrenos como consecuencia de las siguientes mejoras costeadas por los particulares:"
                            - generic [ref=e347]: a) Represas, tranques, canales y otras obras artificiales permanentes de regadío para terrenos de secano;
                            - generic [ref=e348]: b) Obras de drenaje hechas en terrenos húmedos o turbosos, y que los habiliten para su cultivo agrícola;
                            - generic [ref=e349]: c) Limpias y destronques en terrenos planos y lomajes suaves, técnicamente aptos para cultivos;
                            - generic [ref=e350]: d) Empastadas artificiales permanentes en terrenos de secano;
                            - generic [ref=e351]: e) Mejoras permanentes en terrenos inclinados, para defenderlos contra la erosión, para la contención de dunas y cortinas contra el viento, y
                            - generic [ref=e352]: f) Puentes y caminos.
                            - generic [ref=e353]: Para hacer efectivo el beneficio establecido en el inciso anterior, el Servicio de Impuestos Internos al efectuar una nueva tasación del respectivo inmueble, clasificará y tasará el valor de los terrenos agrícolas. Determinará al mismo tiempo la parte que en el avalúo total corresponda al mayor valor adquirido por los terrenos con ocasión de las mejoras introducidas, para los efectos de excluirlos del referido avalúo total, previa declaración del interesado, quien deberá acreditar que cumple con los requisitos exigidos por este inciso y el anterior. La declaración precedente deberá hacerse conjuntamente y en el mismo plazo en que deba presentarse la declaración señalada en el artículo 3° de esta ley, y en la forma que determine el Servicio de Impuestos Internos.
