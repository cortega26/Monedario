                            - generic [ref=e343]:
                              - text: En el caso de los bienes comprendidos en esta serie el impuesto recaerá sobre el avalúo de los terrenos y sobre el valor de las casas patronales que exceda de doc
                              - 'link "NOTA: 1" [ref=e345] [cursor=pointer]':
