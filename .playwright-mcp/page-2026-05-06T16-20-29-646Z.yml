                            - generic [ref=e364]: Los bienes nacionales de uso público no serán avaluados, excepto en los casos que proceda la aplicación del artículo 48° de esta ley.
                            - generic [ref=e365]:
                              - 'link "NOTA: 1" [ref=e366] [cursor=pointer]':
                                - /url: "#rnp2"
                              - text: El Artículo 1° Transitorio de la Ley N° 19.388, publicada en el "Diario Oficial" de 30 de Mayo de 1995, dispuso su entrada en vigencia un mes después de su publicación. No obstante, hasta la entrada en vigencia de la primera tasación de los bienes raíces, agrícolas y no agrícolas, que se efectúe con posterioridad a la promulgación de esta ley, no se aplicará lo dispuesto en el número 3 del artículo 3°.
                            - generic [ref=e367]:
                              - 'link "NOTA: 1.1" [ref=e368] [cursor=pointer]':
                                - /url: "#rnp3"
                              - text: El Artículo único de la Ley N° 19.468, publicada en el "Diario Oficial" de 29 de Agosto de 1996, ordenó prorrogar hasta el 30 de Junio de 1998, con sujeción a las normas de la presente ley, la vigencia de los avalúos de los bienes raíces agrícolas que regían al 30 de Junio de 1996, y fijó, a contar del 1° de Junio de 1998, la vigencia de los nuevos avalúos que se determinen. En su inciso segundo dispone que "Para la fijación de los nuevos avalúos, el Servicio de Impuestos Internos podrá eximir de la obligación de presentar la delcaración a que se refiere el artículo 3° de la Ley N° 17.235, a todos los contribuyentes o a una parte de ellos.".
                        - generic [ref=e369]:
                          - text:  
                          - generic [ref=e371]:
                            - generic [ref=e372]: TITULO II
                            - generic [ref=e373]: De las exenciones
                        - generic [ref=e374]:
                          - text:  
                          - generic [ref=e376]:
                            - generic [ref=e377]: Artículo 2°.- Estarán exentos de todo o parte de los impuestos establecidos en la presente ley, los inmuebles señalados en el Cuadro Anexo N° 1 en la forma y condiciones que en él se indican. Además estarán exentos de todo o parte del referido impuesto, aquellos predios que no se mencionan en dicho cuadro y que gozan de este beneficio en virtud de leyes especiales.
                            - generic [ref=e378]:
                              - text: Si por cualquier circunstancia un determinado predio
                              - generic [ref=e379]:
                                - text: LEY 19388
                                - text: Art.3°,2.
                              - text: tuviera derecho a gozar de dos o más exenciones del impuesto territorial, éstas no se podrán acordar en forma copulativa. Igual norma se aplicará en los casos de exenciones temporales, en las cuales no podrán acumularse plazos de exención. En estas circunstancias, el Servicio otorgará para efectos del impuesto territorial la exención más beneficiosa para el contribuyente.
                            - generic [ref=e380]:
                              - text: Todo bien raíz no agrícola cuyo destino original
                              - generic [ref=e381]:
                                - text: LEY 19578
                                - text: Art. 19
                                - text: D.O. 29.07.1998
                              - text: sea la habitación, que haya sido destinado posteriormente en forma parcial a un uso distinto a éste, cuyo avalúo sea igual o inferior al monto de la exención general habitacional y que esté habitado por su propietario, persona natural, gozará de una exención del 100% del Impuesto Territorial.
