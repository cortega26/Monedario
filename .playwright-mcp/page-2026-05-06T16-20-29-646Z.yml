                          - text:  
                          - generic [ref=e389]:
                            - generic [ref=e390]: Artículo 3°.- El Servicio de Impuestos Internos deberá tasar los bienes sujetos a las disposiciones de esta ley, por comunas, provincias o agrupaciones comunales o provinciales, en el orden y fecha que señale el Presidente de la República.
                            - generic [ref=e391]:
                              - text: El Servicio coordinará con los municipios la
                              - generic [ref=e392]:
                                - text: LEY 19388
                                - text: Art.3°,3.b)
                              - text: tasación de los bienes raíces de sus respectivos territorios.
                            - generic [ref=e393]:
                              - text: Entre dos tasaciones consecutivas de una misma comuna, no podrá mediar un lapso superior a 5 años ni
                              - generic [ref=e394]:
                                - text: LEY 19388
                                - text: Art.3°,3.a)
                              - text: inferior a 3 años.
                            - generic [ref=e395]:
                              - text: Para los efectos de la tasación, los contribuyentes deberán presentar al Servicio de Impuestos Internos una
                              - generic [ref=e396]:
                                - text: LEY 19388
                                - text: Art.3°,3.c)
                              - text: declaración descriptiva del inmueble, en la forma y dentro del plazo que señale el Reglamento.
