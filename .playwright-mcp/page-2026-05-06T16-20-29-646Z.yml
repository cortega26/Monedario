                              - text: construcciones se basará en su clase y calidad y los valores unitarios se fijarán, tomando en cuenta, además, sus especificaciones técnicas, costos de edificación, edad, destino e importancia de la comuna y de la ubicación del sector comercial. Las tablas de valores unitarios de terrenos, se anotarán en planos de precios y considerando los sectores de ubicación y las obras de urbanización y equipamiento de que disponen.
