                            - generic [ref=e254]: "Núm. 2.356.- Vistos: Que el artículo 9° de la ley N° 16.623, de 25 de Abril de 1967, me facultó para fijar el texto de la ley sobre contribuciones de Bienes Raíces, refundiendo en un solo cuerpo legal la ley N° 4.174, sus modificaciones posteriores y las demás disposiciones complementarias o relacionadas con esta materia contenidas en otros textos legales, decretos o reglamentos;"
